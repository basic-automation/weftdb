[package]
name = "weftdb"
version = "0.3.6"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/weftdb"
readme = "README.md"
description = "Time-series database for irregularly sampled data: interpolation is a first-class query, and every returned point is labelled raw, interpolated or extrapolated."
keywords = ["timeseries", "database", "interpolation", "spline", "time-series"]
categories = ["database-implementations", "science", "mathematics"]

[features]
# Crash-consistency test harness (`durable::fault` actions and the `durable::sim`
# power-cut filesystem). Off by default: without it `fault::hit` is a const no-op
# and `WEFT_FAULT` is never read, so a production build cannot be made to abort.
fault-injection = []
# Off by default; outside the semver promise and pending patent review (ROADMAP.md, Phase 6.1).
# The opt-in bit-sliced (bit-plane-major) value codec from `weft-physical-type`. Without it
# `WEFT_SEGMENT_TRANSPOSED_MAX_OVERHEAD` is ignored with a warning, and reading a segment that
# uses the codec fails with an error naming this feature.
bitsliced-codec = ["weft-physical-type/bitsliced-codec"]
# Off by default (roadmap Phase 5, memory-mapped GPU I/O). Lets `SegmentStoreOptions::mmap_reads`
# (`WEFT_SEGMENT_MMAP_READS`) map sealed frames for range reads instead of reading them into the
# heap; without it the option is accepted and ignored. The one `unsafe` it adds, and why it is
# opt-in, is documented in `segment_store/mapped.rs`.
mmap-reads = ["dep:memmap2"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bigdecimal = { workspace = true, features = ["serde"] }
postcard = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
fake = { workspace = true, features = ["derive", "chrono", "bigdecimal", "uuid"] }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive"] }
turso = { workspace = true }
# Not used directly. turso_core pulls in `branches` 0.4.x with default features off, and on
# nightly (which docs.rs uses) its no-`std` path calls the removed `core::intrinsics::abort`.
# Turning `std` on here unifies the feature for turso_core's copy, so the published crate
# builds on docs.rs; the workspace [patch] does not reach published crates. Remove when
# turso_core depends on branches >= 0.5.1.
branches = { version = "0.4.3", default-features = false, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true, features = ["v4", "serde"] }
wide = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
fastrand = { workspace = true }
futures = { workspace = true }
splimes = { workspace = true, features = ["tokio"] }
weft-physical-type = { workspace = true }
weft-reduce = { workspace = true }
once_cell = { workspace = true }
dirs = { workspace = true }
num_cpus = { workspace = true }
serde_json = { workspace = true }
md5 = { workspace = true }
sysinfo = { workspace = true }
tracing = { workspace = true }
memmap2 = { workspace = true, optional = true }

[dev-dependencies]
csv = { workspace = true }
criterion = { workspace = true , features = ["html_reports"] }
tempfile = { workspace = true }
serial_test = { workspace = true }
# The interpolation benches compare splimes' CPU, rayon and GPU backends, so they need the GPU
# path that the library deliberately does not enable for its users.
splimes = { workspace = true, features = ["gpu"] }
# Only the tests install a subscriber; the library logs through the `tracing` facades.
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
# statvfs, for the whole-store backup's headroom check (D-S16).
libc = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
# Only to keep the fault tests' deliberately aborted child from dumping core.
libc = { workspace = true }

[[bench]]
name = "interpolation_benchmarks"
harness = false

[[bench]]
name = "integration_interpolation_benchmarks"
harness = false

[[bench]]
name = "optimized_interpolation_benchmarks"
harness = false

[[bench]]
name = "strategy_selection_benchmarks"
harness = false

[[bench]]
name = "new_api_benchmarks"
harness = false

[[bench]]
name = "cache_performance_benchmarks"
harness = false

[[bench]]
name = "downsample_range"
harness = false

[[bench]]
name = "interpolate_range"
harness = false

[[bench]]
name = "backup_cost"
harness = false

