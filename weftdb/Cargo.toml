[package]
name = "weftdb"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Time-series database for irregularly sampled data: interpolation is a first-class query, and every returned point is labelled raw, interpolated or extrapolated."
keywords = ["timeseries", "database", "interpolation", "spline", "time-series"]
categories = ["database-implementations", "science", "mathematics"]

[features]
# Crash-consistency test harness (`durable::fault` actions and the `durable::sim`
# power-cut filesystem). Off by default: without it `fault::hit` is a const no-op
# and `WEFT_FAULT` is never read, so a production build cannot be made to abort.
fault-injection = []
# Off by default; outside the semver promise and pending patent review (ROADMAP.md, Phase 6.1).
# The opt-in bit-sliced (bit-plane-major) value codec from `weft-physical-type`. Without it
# `WEFT_SEGMENT_TRANSPOSED_MAX_OVERHEAD` is ignored with a warning, and reading a segment that
# uses the codec fails with an error naming this feature.
bitsliced-codec = ["weft-physical-type/bitsliced-codec"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bigdecimal = { workspace = true, features = ["serde"] }
postcard = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
fake = { workspace = true, features = ["derive", "chrono", "bigdecimal", "uuid"] }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive"] }
turso = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true, features = ["v4", "serde"] }
wide = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
fastrand = { workspace = true }
futures = { workspace = true }
splimes = { workspace = true, features = ["tokio"] }
weft-physical-type = { workspace = true }
weft-reduce = { workspace = true }
once_cell = { workspace = true }
dirs = { workspace = true }
num_cpus = { workspace = true }
serde_json = { workspace = true }
md5 = { workspace = true }
sysinfo = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
csv = { workspace = true }
criterion = { workspace = true , features = ["html_reports"] }
tempfile = { workspace = true }
serial_test = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
# Only to keep the fault tests' deliberately aborted child from dumping core.
libc = { workspace = true }

[[bench]]
name = "interpolation_benchmarks"
harness = false

[[bench]]
name = "integration_interpolation_benchmarks"
harness = false

[[bench]]
name = "optimized_interpolation_benchmarks"
harness = false

[[bench]]
name = "strategy_selection_benchmarks"
harness = false

[[bench]]
name = "new_api_benchmarks"
harness = false

[[bench]]
name = "cache_performance_benchmarks"
harness = false

[[bench]]
name = "downsample_range"
harness = false

[[bench]]
name = "interpolate_range"
harness = false

[[bench]]
name = "backup_cost"
harness = false

