[package]
name = "weft-server"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "HTTP API server for WeftDB: health/readiness, ingest, query, interpolation and storage-management endpoints."
keywords = ["timeseries", "database", "http", "server", "weftdb"]
categories = ["database-implementations", "web-programming::http-server"]
# Binary/tooling crate: shipped as a GitHub release artifact, not published to crates.io.
publish = false


[lib]
name = "weft_server"
path = "src/lib.rs"

[[bin]]
name = "weft-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
bigdecimal = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
weftdb = { workspace = true }  # control-plane segment store backing the storage query endpoints
weft-arrow = { workspace = true }  # reconstructed-series -> Arrow IPC / Parquet bytes for the interpolate endpoint (arrow types stay inside weft-arrow)
weft-arrow-store = { workspace = true }  # stored range -> Arrow IPC bytes (keeps the arrow-* tree off the lean core)
weft-line-protocol = { workspace = true }
weft-physical-type = { workspace = true }  # AspectSchema / PhysicalType / TimeUnit for the catalog-management write path
weft-reduce = { workspace = true }  # canonical downsample reduction (Aggregation / reduce / bucket_start)
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
splimes = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }  # per-request engine spans on the compute path (Phase 3 instrumentation)
tracing-subscriber = { workspace = true }  # RUST_LOG-driven span/event subscriber (env-filter from the workspace dep)
opentelemetry = { workspace = true }  # OTLP trace export (Phase 3) — env-gated on OTEL_EXPORTER_OTLP_ENDPOINT
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util", "macros"] }
tempfile = { workspace = true }
