# cargo-deny policy — run in CI as `cargo deny check`.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails the check.
# To accept one deliberately, add it below with a reason and a date to revisit.
ignore = [
    # RUSTSEC-2026-0543: `chrono` is unmaintained, and RustSec states there is no safe
    # upgrade. As of 2026-11-17 the newest release is 0.4.45, and arrow 60.1.0 still
    # requires chrono ^0.4.40, so neither the nine manifests that depend on chrono
    # directly nor the arrow-flight path that pulls it in transitively can move off it.
    # The ignore carries an expiry on purpose: when the date lapses the check goes red
    # again until the migration (#791) lands or upstream changes. Filed as #790.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, no upgrade path: chrono 0.4.45 is the newest release and arrow 60.1.0 requires chrono ^0.4.40; moving to time or jiff is #791", expiry = "2027-01-31" },
]

# An ignore that stops matching is a bug, not a free pass: the entry is stale, the
# advisory is gone, and the exception should be deleted. Loud, so nobody carries a
# dead exception into a release.
unused-ignored-advisory = "deny"


[licenses]
# The allow-list below is also about.toml's, which generates THIRD-PARTY-LICENSES.md, the
# dependency license bundle every release archive carries: change one and change the other.
# A dependency this file accepts but about.toml does not would still be linked into a
# released binary while being missing from the bundle that names its license.
# Permissive licenses only. WeftDB is MIT OR Apache-2.0; anything copyleft needs an explicit exception.
allow = [
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"BSL-1.0",
	"CC0-1.0",
	"ISC",
	"Unicode-3.0",
	"Unicode-DFS-2016",
	"Unlicense",
	"Zlib",
]
confidence-threshold = 0.9
exceptions = [
	# MPL-2.0 is file-level copyleft: it covers modifications to option-ext's own files,
	# not WeftDB. Used unmodified, via `dirs`.
	{ allow = ["MPL-2.0"], crate = "option-ext" },
	# Only reachable on targets WeftDB doesn't ship for (via crossterm's Windows/terminfo path).
	{ allow = ["WTFPL"], crate = "terminfo" },
	# CDLA-Permissive-2.0 is the Mozilla CA list's data licence. Only reachable on wasm32
	# (rustls-platform-verifier's bundled roots, via weftdb-client's `rustls` feature), a target
	# WeftDB doesn't build for; no shipped binary links it.
	{ allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
# Duplicate versions are common transitively (wgpu, arrow, turso); report, don't fail.
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies are declared once in [workspace.dependencies] with a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
