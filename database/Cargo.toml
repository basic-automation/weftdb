[package]
name = "database"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
bigdecimal = { version = "0.4", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
fake = { version = "2.9", features = ["derive", "chrono", "bigdecimal", "uuid"] }
rand = "0.8"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
wide = "0.7"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

[[bench]]
name = "interpolation_benchmarks"
harness = false

[[bench]]
name = "integration_interpolation_benchmarks"
harness = false

[[bench]]
name = "optimized_interpolation_benchmarks"
harness = false

[[bench]]
name = "simd_benchmarks"
harness = false