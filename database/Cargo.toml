[package]
name = "database"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
bigdecimal = { workspace = true, features = ["serde"] }
chrono = { workspace = true, features = ["serde"] }
fake = { workspace = true, features = ["derive", "chrono", "bigdecimal", "uuid"] }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true, features = ["v4", "serde"] }
wide = { workspace = true }
flume = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
pollster = { workspace = true }
fastrand = { workspace = true }
futures = { workspace = true }
splimes = { workspace = true }
csv = { workspace = true }
once_cell = "1.19"

[dev-dependencies]
criterion = { workspace = true , features = ["html_reports"] }
tempfile = { workspace = true }

[[bench]]
name = "interpolation_benchmarks"
harness = false

[[bench]]
name = "integration_interpolation_benchmarks"
harness = false

[[bench]]
name = "optimized_interpolation_benchmarks"
harness = false

[[bench]]
name = "strategy_selection_benchmarks"
harness = false

[[bench]]
name = "new_api_benchmarks"
harness = false

[[bench]]
name = "cache_performance_benchmarks"
harness = false

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"