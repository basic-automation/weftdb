[package]
name = "weft-bench"
license.workspace = true
repository.workspace = true
authors.workspace = true
version = "0.1.0"
edition = "2021"
description = "Weft-Bench: reproducible, correctness-gated benchmark harness for WeftDB (interpolation-heavy irregular time-series)."

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bigdecimal = { workspace = true, features = ["serde"] }
chrono = { workspace = true, features = ["serde"] }
weft-line-protocol = { workspace = true }
rayon = { workspace = true }
weft-physical-type = { workspace = true }
weft-reduce = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
splimes = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util", "macros"] }
