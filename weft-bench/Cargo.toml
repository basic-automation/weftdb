[package]
name = "weft-bench"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Reproducible, correctness-gated benchmark harness for WeftDB (interpolation-heavy irregular time series)."
keywords = ["benchmark", "timeseries", "database", "interpolation", "weftdb"]
categories = ["development-tools::profiling", "database"]
# Binary/tooling crate: shipped as a GitHub release artifact, not published to crates.io.
publish = false


[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bigdecimal = { workspace = true, features = ["serde"] }
chrono = { workspace = true, features = ["serde"] }
weft-line-protocol = { workspace = true }
rayon = { workspace = true }
weft-physical-type = { workspace = true }
weft-reduce = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
splimes = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util", "macros"] }
