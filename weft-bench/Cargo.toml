[package]
name = "weft-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Reproducible, correctness-gated benchmark harness for WeftDB (interpolation-heavy irregular time series)."
keywords = ["benchmark", "timeseries", "database", "interpolation", "weftdb"]
categories = ["development-tools::profiling", "database"]
# Binary/tooling crate: shipped as a GitHub release artifact, not published to crates.io.
publish = false


[dependencies]
anyhow = { workspace = true }
# The Parquet results table (`--parquet`): arrow builders + weft-arrow's uncompressed writer.
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
bigdecimal = { workspace = true, features = ["serde"] }
chrono = { workspace = true, features = ["serde"] }
weft-line-protocol = { workspace = true }
rayon = { workspace = true }
# `experimental-codecs`: the advisory f64 (Gorilla/Chimp/Chimp128) and FIRE estimates the
# StorageEstimate reports. Enabled here only, so no published crate turns them on.
weft-physical-type = { workspace = true, features = ["experimental-codecs"] }
weft-reduce = { workspace = true }
weft-arrow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The run manifest hashes the report file it points at (EVI-3).
sha2 = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
# The benchmark's engine metadata and its gpu-memory workload call splimes' GPU entry points
# (`prewarm_gpu`, `calibrate`, `gpu_pool_stats`), so it opts into the backend that the library
# crates no longer carry. PAC-3.
splimes = { workspace = true, features = ["tokio", "gpu"] }
sysinfo = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util", "macros"] }
