[package]
name = "weft-arrow"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Apache Arrow interchange for WeftDB's typed columnar segments: sealed segment to RecordBatch and back, plus Arrow IPC and Parquet bytes."
keywords = ["arrow", "parquet", "timeseries", "columnar", "interchange"]
categories = ["encoding", "data-structures", "database"]


[lib]
name = "weft_arrow"
path = "src/lib.rs"

[dependencies]
weft-physical-type = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-ipc = { workspace = true }
parquet = { workspace = true }
bytes = { workspace = true }
bigdecimal = { workspace = true }
