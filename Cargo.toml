[workspace]
resolver = "2"
members = [
	"weftdb",
	"weft-orchestration",
	"splimes",
	"weft-tui",
	"weft-bench",
	"weft-server",
	"weft-line-protocol",
	"weft-physical-type",
	"weft-arrow",
	"weft-arrow-store",
	"weft-reduce",
]

# Fields every workspace member inherits with `<field>.workspace = true`. Each crate keeps
# its own edition and description; everything else is released in lockstep.
[workspace.package]
version = "0.1.0"
license = "MIT"
authors = ["Justin Icenhour"]
repository = "https://github.com/basic-automation/weftdb"
homepage = "https://github.com/basic-automation/weftdb"
readme = "README.md"
# The workspace builds on stable Rust. The floor is set by the `sysinfo` dependency,
# not by the 2024 edition `splimes` targets; verified with `cargo +1.95 check --workspace`.
rust-version = "1.95"
keywords = ["timeseries", "database", "interpolation", "spline", "time-series"]
categories = ["database-implementations", "science", "mathematics"]

[workspace.dependencies]
anyhow = "1"
ctor = "0.4"
async-trait = "0"
ahash = "0"
bigdecimal = "0"
bincode = "1"
chrono = { version = "0", features = ["serde"] }
criterion = { version = "0", features = ["html_reports"] }
fake = "2"
flume = "0"
futures = "0"
pollster = "0"
rand = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
turso = { version = "0.6" }
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
wide = "1"
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }
fastrand = "2"
num_cpus = "1"
ratatui = "0"
crossterm = "0"
futures-channel = "0"
sysinfo = "0"
weftdb = { path = "./weftdb", version = "0.1.0" }
weft-orchestration = { path = "./weft-orchestration", version = "0.1.0" }
splimes = { path = "./splimes", version = "0.1.0" }
weft-line-protocol = { path = "./weft-line-protocol", version = "0.1.0" }
weft-physical-type = { path = "./weft-physical-type", version = "0.1.0" }
weft-reduce = { path = "./weft-reduce", version = "0.1.0" }
weft-arrow = { path = "./weft-arrow", version = "0.1.0" }
weft-arrow-store = { path = "./weft-arrow-store", version = "0.1.0" }
arrow-array = "59"
arrow-schema = "59"
arrow-ipc = "59"
parquet = { version = "59", default-features = false, features = ["arrow"] }
bytes = "1"
csv = "1"
indexmap = "2"
serial_test = { version = "3", default-features = false, features = ["async"] }
tracing = "0"
tracing-core = "0"
tracing-subscriber = { version = "0", features = ["env-filter"] }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.33"
once_cell = "1"
md5 = "0"
rand_chacha = "0.9"
dirs = "5"
axum = "0.8"
tower = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
debug = 1
