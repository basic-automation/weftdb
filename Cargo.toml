[package]
name = "dsm_batch"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bigdecimal = { version = "0", features=["serde"] }
serde = { version = "1", features = ["derive"] }
uuid = { version="1", features=["v4", "fast-rng", "macro-diagnostics", "serde"] }
dsm_measurement = { path = "../1 - dsm-measurement" }
rayon = "1"
num-bigint = { version="0", features = ["serde"] }
indexmap = {version = "1", features = ["serde", "rustc-rayon"]}
chrono = { version="0", features = ["serde"] }
serde_json = { version="1", features = ["preserve_order"] }
dsm_log = { path = "../dsm-log" }



[profile.release]
strip = true
opt-level = "s"
debug = 0
lto = true
codegen-units = 1
