[package]
name = "dsm-patterner"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = {version = "0", features= []}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = {version = "0", features=["json"]}
uuid = {version="1", features=["v4", "fast-rng", "macro-diagnostics", "serde"]}
bigdecimal = {version="0", features=["serde"]}
dsm_pattern = { path = "../6 - dsm-pattern" }
#dsm_batch = { path = "../4 - dsm-batch" }
num-bigint = {version="0", features=["serde"]}
#futures = "0.3.26"


[profile.release]
strip = true
opt-level = "s"
debug = 0
lto = true
codegen-units = 1