[package]
name = "dsm_log"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version="1", features=["derive"]}
serde_json = { version="1", features=["preserve_order", "indexmap", "arbitrary_precision"] }
indexmap = { version="1", features=["serde", "rayon"] }
chrono = { version="0", features=["serde"] }