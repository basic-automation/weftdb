[package]
name = "dsm_input"
version = "0.0.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["full"] }
dsm_asset = { path = "../dsm-asset" }
dsm_source = { path = "../dsm-source" }
dsm_measurement = { path = "../dsm-measurement" }


[profile.release]
strip = true
opt-level = "s"
debug = 0
lto = "fat"
codegen-units = 1