[workspace]
# weft-xbench builds DuckDB from C++ source; it is its own workspace (see its Cargo.toml).
exclude = ["weft-xbench"]
resolver = "2"
members = [
	"weftdb",
	"weft-orchestration",
	"weft-tui",
	"weft-bench",
	"weft-server",
	"weft-line-protocol",
	"weft-physical-type",
	"weft-arrow",
	"weft-arrow-store",
	"weft-reduce",
]

# Fields every workspace member inherits with `<field>.workspace = true`.
#
# `version` is deliberately absent. Each crate names its own, so a patch that touches one
# library does not bump the other nine and ship nine releases whose only change is the
# number. The release tag is still one version — `weft-server`'s, which
# scripts/release/verify.sh reads — and `scripts/crates/check.py` keeps the per-crate
# versions and the path-dependency requirements below in step. FRE-1.
#
# `edition` is here so the workspace has exactly one: a crate on another edition compiles
# under different rules than the crates next to it. FRE-22's move to 2024 is this one line.
#
# `readme` is inherited by the binary crates, which the registry never serves. A published
# crate points at its own README, because that file is what crates.io renders as its page.
[workspace.package]
license = "MIT OR Apache-2.0"
authors = ["Justin Icenhour"]
repository = "https://github.com/basic-automation/weftdb"
readme = "README.md"
edition = "2021"
# The workspace builds on stable Rust. The floor is set by the `sysinfo` dependency,
# not by the 2024 edition of the `splimes` dependency; verified with `cargo +1.95 check --workspace`.
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
# Deliberately NOT pinned. weft-reduce's integer fast paths reproduce bigdecimal 0.4.11's operator
# rules (the Div/Mul/Add special cases) so results stay identical in representation, which a
# newer 0.4.x could change. Pinning would stop that, but BigDecimal is in the published API, so
# an exact pin makes a downstream crate (or another dependency) that needs a newer 0.4.x fail to
# resolve and makes a RustSec fix wait for a release here. Drift is caught instead by
# .github/workflows/bigdecimal-drift.yml, which runs weft-reduce's differential tests against
# the newest 0.4.x every week. If it fails, fix scaled.rs (or pin) before cutting a release.
bigdecimal = "0.4"
postcard = { version = "1", default-features = false, features = ["use-std"] }
chrono = { version = "0.4", features = ["serde"] }
criterion = { version = "0.8", features = ["html_reports"] }
fake = "5"
futures = "0.3"
rand = "0.10"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The run manifest's content hash (`weft-bench verify`). EVI-3.
sha2 = "0.10.9"
# The allocator our own executables run on, named by each of them rather than inherited: see
# `weft-server/src/main.rs` and `weft-tui/src/main.rs`. PAC-3.
mimalloc = "0.1"
# `mimalloc` is deliberately not enabled here: turso's `mimalloc` feature installs a
# process-wide `#[global_allocator]` from its own crate root, so asking for it through a
# library replaces the allocator of every program that merely links that library — including one
# that sets its own, or wants the system default. Nothing in this workspace enables it any more;
# an executable that wants mimalloc depends on it and declares it in its own root, and a library
# user who wants it does the same. turso's other default, `fts`, was already off in this workspace
# and stays off — it is the full-text-search feature, and turning it on here would pull tantivy,
# tantivy-columnar, zstd-sys and the rest of that tree into every build. PAC-3.
turso = { version = "0.8", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.27", features = ["v4", "serde"] }
wide = "1"
bytemuck = { version = "1", features = ["derive"] }
fastrand = "2"
libc = "0.2"
num_cpus = "1"
ratatui = "0.30"
crossterm = "0.29"
sysinfo = "0.39"
# The workspace's own crates. Each row carries the version requirement its dependents get,
# and the member named by `path` must be at least that version: crates.io resolves a path
# dependency by its version, so bumping one side and not the other fails `cargo publish` at
# the tag with a message about the workspace layout. `python3 scripts/crates/check.py check`
# names the crate that is out of step, on the PR. FRE-1.
weftdb = { path = "./weftdb", version = "0.1.0" }
# Developed in its own repository (github.com/basic-automation/splimes), on its own roadmap.
# `default-features = false` because splimes' defaults turn on its `gpu` backend, which pulls
# `wgpu` — Vulkan, Metal, DX12 and a shader compiler — into every crate that links a library
# in this workspace, including the published `weftdb`. The GPU path is the executable's
# decision: `weft-server` and `weft-bench` enable `splimes/gpu`, and `weft-orchestration`
# exposes it as its own opt-in `gpu-codecs` feature. `serde` stays on, because
# `weftdb::BatchedMeasurement`'s derived serde needs splimes' own implementations. PAC-3.
splimes = { version = "1", default-features = false, features = ["serde"] }
weft-line-protocol = { path = "./weft-line-protocol", version = "0.1.0" }
weft-physical-type = { path = "./weft-physical-type", version = "0.1.0" }
weft-reduce = { path = "./weft-reduce", version = "0.1.0" }
weft-arrow = { path = "./weft-arrow", version = "0.1.0" }
weft-arrow-store = { path = "./weft-arrow-store", version = "0.1.0" }
arrow-array = "60"
arrow-schema = "60"
arrow-ipc = "60"
parquet = { version = "60", default-features = false, features = ["arrow"] }
bytes = "1"
csv = "1"
indexmap = "2"
serial_test = { version = "4", default-features = false, features = ["async"] }
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.34"
once_cell = "1"
md5 = "0.8"
rand_chacha = "0.10"
dirs = "7"
axum = "0.8"
tower = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true

# The binaries in a release archive (.github/workflows/release.yml, RELEASING.md): the
# release profile without its debug info, which is kept there for profiling and makes
# weft-server about 400 MB. Symbols are stripped too, so a panic's backtrace shows no
# function names; reproduce a crash with a `--release` build to get them.
[profile.dist]
inherits = "release"
debug = false
strip = "symbols"

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
debug = 1

# `turso_core` 0.8.x pins `branches = "0.4.3"`, whose no-`std` nightly path calls an intrinsic
# that nightly 2026-10-15 removed, so the advisory `check (nightly)` job could not compile it.
# The patched copy changes that one line (see patches/branches/Cargo.toml). Drop this patch and
# the directory once turso_core depends on branches >= 0.5.1.
[patch.crates-io]
branches = { path = "patches/branches" }
