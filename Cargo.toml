[package]
name = "dsm_measurement"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
#dsm_asset = { path = "../dsm-asset" }
#dsm_source = { path = "../dsm-source" }
#dsm_influxdb = { path = "../dsm-influxdb" }
#dsm_bucket = { path = "../dsm-bucket" }
chrono = "0"
serde = { version = "1", features = ["derive"] }
bigdecimal = { version="0", features = ["serde"] }
uuid = { version="1", features=["v4", "fast-rng", "macro-diagnostics", "serde"] }
