[workspace]
resolver = "2"
members = ["database", "database_orchestration", "splimes", "weft-tui", "weft-bench", "weft-server", "weft-line-protocol", "weft-physical-type", "weft-arrow", "weft-arrow-store", "weft-reduce"]

# Fields every workspace member inherits with `<field>.workspace = true`. Each crate keeps
# its own version, edition and description.
[workspace.package]
license = "MIT"
authors = ["Justin Icenhour"]
repository = "https://github.com/physics515/weftdb"

[workspace.dependencies]
anyhow = "1"
ctor = "0.4"
async-trait = "0"
ahash = "0"
bigdecimal = "0"
bincode = "1"
chrono = { version = "0", features = ["serde"] }
criterion = { version = "0", features = ["html_reports"] }
fake = "2"
flume = "0"
futures = "0"
pollster = "0"
rand = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
turso = { version = "0.6" }
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
wide = "1"
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }
fastrand = "2"
num_cpus = "1"
ratatui = "0"
crossterm = "0"
futures-channel = "0"
sysinfo = "0"
splimes = { path = "./splimes" }
weft-line-protocol = { path = "./weft-line-protocol" }
weft-physical-type = { path = "./weft-physical-type" }
weft-reduce = { path = "./weft-reduce" }
weft-arrow = { path = "./weft-arrow" }
arrow-array = "59"
arrow-schema = "59"
arrow-ipc = "59"
parquet = { version = "59", default-features = false, features = ["arrow"] }
bytes = "1"
csv = "1"
indexmap = "2"
serial_test = { version = "3", default-features = false, features = ["async"] }
tracing = "0"
tracing-core = "0"
tracing-subscriber = { version = "0", features = ["env-filter"] }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.33"
once_cell = "1"
md5 = "0"
rand_chacha = "0.9"
dirs = "5"
axum = "0.8"
tower = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
debug = 1
