[package]
name = "dsm-input"
version = "0.0.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dsm_asset = { path = "../dsm-asset" }
dsm_source = { path = "../dsm-source" }
dsm_measurement = { path = "../dsm-measurement" }
axum = {version = "0", features= []}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = "0"
urlencoding = "2"
chrono = "0"
uuid = {version="1", features=["v4", "fast-rng", "macro-diagnostics", "serde"]}


[profile.release]
strip = true
opt-level = "s"
debug = 0
lto = "fat"
codegen-units = 1
