[workspace]
resolver = "2"
members = ["database", "database_orchestration", "splimes", "weft-tui", "weft-bench", "weft-server", "weft-line-protocol", "weft-physical-type", "weft-arrow", "weft-arrow-store", "weft-reduce"]

# Fields every workspace member inherits with `<field>.workspace = true`. Each crate keeps
# its own version, edition and description.
[workspace.package]
license = "MIT"
authors = ["Justin Icenhour"]
repository = "https://github.com/basic-automation/weftdb"

[workspace.dependencies]
anyhow = "1"
ctor = "1.0"
async-trait = "0.1"
bigdecimal = "0.4"
postcard = { version = "1", default-features = false, features = ["use-std"] }
chrono = { version = "0.4", features = ["serde"] }
criterion = { version = "0.8", features = ["html_reports"] }
fake = "5"
futures = "0.3"
rand = "0.10"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
turso = { version = "0.8", default-features = false, features = ["mimalloc"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.27", features = ["v4", "serde"] }
wide = "1"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
fastrand = "2"
num_cpus = "1"
ratatui = "0.30"
crossterm = "0.29"
futures-channel = "0.3"
sysinfo = "0.39"
splimes = { path = "./splimes" }
weft-line-protocol = { path = "./weft-line-protocol" }
weft-physical-type = { path = "./weft-physical-type" }
weft-reduce = { path = "./weft-reduce" }
weft-arrow = { path = "./weft-arrow" }
arrow-array = "60"
arrow-schema = "60"
arrow-ipc = "60"
parquet = { version = "60", default-features = false, features = ["arrow"] }
bytes = "1"
csv = "1"
indexmap = "2"
serial_test = { version = "4", default-features = false, features = ["async"] }
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.34"
once_cell = "1"
md5 = "0.8"
rand_chacha = "0.10"
dirs = "7"
axum = "0.8"
tower = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
debug = 1
