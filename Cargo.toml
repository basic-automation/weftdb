[workspace]
resolver = "2"
members = [
	"weftdb",
	"weft-orchestration",
	"weft-tui",
	"weft-bench",
	"weft-server",
	"weft-line-protocol",
	"weft-physical-type",
	"weft-arrow",
	"weft-arrow-store",
	"weft-reduce",
]

# Fields every workspace member inherits with `<field>.workspace = true`. Each crate keeps
# its own edition and description; everything else is released in lockstep.
[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0"
authors = ["Justin Icenhour"]
repository = "https://github.com/basic-automation/weftdb"
readme = "README.md"
# The workspace builds on stable Rust. The floor is set by the `sysinfo` dependency,
# not by the 2024 edition of the `splimes` dependency; verified with `cargo +1.95 check --workspace`.
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
# Pinned exactly: weft-reduce reproduces 0.4.11's operator rules (the Div/Mul/Add special cases)
# so its integer fast paths return results identical in representation. A newer 0.4.x must pass
# the differential tests in weft-reduce/src/scaled.rs before this moves.
# Cost, accepted for 1.0: BigDecimal is in the published API, so a downstream crate (or another
# dependency) that needs >= 0.4.12 fails to resolve, and a RustSec advisory on bigdecimal needs
# a release here rather than `cargo update`. The lighter alternative is a CI job that runs those
# differential tests after `cargo update -p bigdecimal`; revisit this pin if either cost bites.
bigdecimal = "=0.4.11"
postcard = { version = "1", default-features = false, features = ["use-std"] }
chrono = { version = "0.4", features = ["serde"] }
criterion = { version = "0.8", features = ["html_reports"] }
fake = "5"
futures = "0.3"
rand = "0.10"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
turso = { version = "0.8", default-features = false, features = ["mimalloc"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.27", features = ["v4", "serde"] }
wide = "1"
bytemuck = { version = "1", features = ["derive"] }
fastrand = "2"
libc = "0.2"
num_cpus = "1"
ratatui = "0.30"
crossterm = "0.29"
sysinfo = "0.39"
weftdb = { path = "./weftdb", version = "0.1.0" }
# Developed in its own repository (github.com/basic-automation/splimes), on its own roadmap.
splimes = "1"
weft-line-protocol = { path = "./weft-line-protocol", version = "0.1.0" }
weft-physical-type = { path = "./weft-physical-type", version = "0.1.0" }
weft-reduce = { path = "./weft-reduce", version = "0.1.0" }
weft-arrow = { path = "./weft-arrow", version = "0.1.0" }
weft-arrow-store = { path = "./weft-arrow-store", version = "0.1.0" }
arrow-array = "60"
arrow-schema = "60"
arrow-ipc = "60"
parquet = { version = "60", default-features = false, features = ["arrow"] }
bytes = "1"
csv = "1"
indexmap = "2"
serial_test = { version = "4", default-features = false, features = ["async"] }
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.34"
once_cell = "1"
md5 = "0.8"
rand_chacha = "0.10"
dirs = "7"
axum = "0.8"
tower = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true

# The binaries in a release archive (.github/workflows/release.yml, RELEASING.md): the
# release profile without its debug info, which is kept there for profiling and makes
# weft-server about 400 MB. Symbols are stripped too, so a panic's backtrace shows no
# function names; reproduce a crash with a `--release` build to get them.
[profile.dist]
inherits = "release"
debug = false
strip = "symbols"

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
debug = 1
