[package]
name = "dsm_log"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version="*", features=["derive"]}
serde_json = { version="*", features=["preserve_order", "indexmap", "arbitrary_precision"] }
indexmap = { version="*", features=["serde", "rayon"] }
chrono = { version="*", features=["serde"] }