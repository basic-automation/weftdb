[workspace]
resolver = "2"
members = ["database", "dataset_management", "splimes"]

[workspace.dependencies]
anyhow = "1.0"
bigdecimal = "0.4"
chrono = { version = "0.4", features = ["serde"] }
criterion = { version = "0.5", features = ["html_reports"] }
fake = "2.8"
flume = "0.11"
futures = "0.3"
pollster = "0.3"
rand = "0.8"
rayon = "1.7"
serde = { version = "1.0", features = ["derive"] }
sqlx = "0.7"
tempfile = "3.8"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
wide = "0.7"
wgpu = "0.19"
bytemuck = { version = "1.13", features = ["derive"] }
fastrand = "2.0"
num_cpus = "1.17.0"
ratatui = "0.29.0"
crossterm = "0.29.0"
futures-channel = "0.3"
sysinfo = "0.36.1"
splimes = { path = "./splimes" }
csv = "1.3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
