[package]
name = "weft-physical-type"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Declared physical numeric encodings for time-series values. BigDecimal stays the logical type; downcasting is explicit and reports exactness, never a silent precision loss."
keywords = ["timeseries", "encoding", "decimal", "precision", "columnar"]
categories = ["encoding", "data-structures", "mathematics"]


[lib]
name = "weft_physical_type"
path = "src/lib.rs"

[dependencies]
bigdecimal = { workspace = true, features = ["serde"] }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "bitunpack"
harness = false

[[bench]]
name = "pointread"
harness = false

[[bench]]
name = "dodsearch"
harness = false

[[bench]]
name = "transposed_read"
harness = false
