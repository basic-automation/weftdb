[package]
name = "weft-physical-type"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Declared physical numeric encodings for time-series values. BigDecimal stays the logical type; downcasting is explicit and reports exactness, never a silent precision loss."
keywords = ["timeseries", "encoding", "decimal", "precision", "columnar"]
categories = ["encoding", "data-structures", "mathematics"]


[lib]
name = "weft_physical_type"
path = "src/lib.rs"

# Off by default, outside the 1.0 semver promise, and pending patent review (ROADMAP.md,
# Phase 6.1 codec patent/licence gate). Nothing the `.weftseg` writer emits under the
# default configuration depends on a feature here, so a default build reads every frame
# written under that configuration (`FrameOptions::transposed_max_overhead` unset). A frame
# written with that option set — as builds from before v0.1.0 did whenever it was set — needs
# `bitsliced-codec`.
[features]
# Advisory float/timestamp codecs the `.weftseg` writer never emits: the `floatcodec`
# module (Gorilla-XOR, Chimp, Chimp128, Elf and the `best_f64_*` selector) and the Sprintz
# FIRE forecaster (`fire_*`).
experimental-codecs = []
# The opt-in bit-sliced (bit-plane-major) `ScaledI64` value codec, `VAL_CODEC_TRANSPOSED`.
# Without it the writer never selects the codec and a frame that uses it fails to read with
# `WeftSegError::CodecNotEnabled`, naming this feature.
bitsliced-codec = []

[dependencies]
bigdecimal = { workspace = true, features = ["serde"] }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "bitunpack"
harness = false
required-features = ["bitsliced-codec"]

[[bench]]
name = "pointread"
harness = false

[[bench]]
name = "dodsearch"
harness = false

[[bench]]
name = "transposed_read"
harness = false
required-features = ["bitsliced-codec"]
