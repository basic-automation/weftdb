[package]
name = "weft-physical-type"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Declared physical numeric encodings for time-series values. BigDecimal stays the logical type; downcasting is explicit and reports exactness, never a silent precision loss."
keywords = ["timeseries", "encoding", "decimal", "precision", "columnar"]
categories = ["encoding", "data-structures", "mathematics"]


[lib]
name = "weft_physical_type"
path = "src/lib.rs"

[dependencies]
bigdecimal = { workspace = true, features = ["serde"] }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
criterion = { workspace = true }
# Bench-only external yardsticks, pinned exactly (0.x carries no semver promise). Nothing in
# the library links them: they exist to measure WeftDB's own codecs against upstream.
fastlanes = "=0.7.2"
alp = "=0.0.4"
pco = "=1.0.4"

[[bench]]
name = "bitunpack"
harness = false

[[bench]]
name = "pointread"
harness = false

[[bench]]
name = "dodsearch"
harness = false

[[bench]]
name = "transposed_read"
harness = false

[[bench]]
name = "fastlanes_yardstick"
harness = false

[[bench]]
name = "alp_vs_f64_codecs"
harness = false
