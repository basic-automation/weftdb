[package]
name = "weft-physical-type"
version = "0.1.0"
edition = "2021"
description = "Vendor-neutral physical numeric encodings for WeftDB aspects (roadmap Phase 4.1). BigDecimal stays the logical/API value type; each aspect declares a PhysicalType governing how its values are encoded on the hot path. Downcasting is explicit and reports exactness — never a silent BigDecimal -> f64."

[lib]
name = "weft_physical_type"
path = "src/lib.rs"

[dependencies]
bigdecimal = { workspace = true, features = ["serde"] }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "bitunpack"
harness = false

[[bench]]
name = "pointread"
harness = false

[[bench]]
name = "dodsearch"
harness = false

[[bench]]
name = "transposed_read"
harness = false
