[package]
name = "splimes"
version.workspace = true
edition = "2024"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Spline interpolation over irregular time series, on CPU (SIMD/rayon) or GPU (wgpu), with provenance-labelled output points."
keywords = ["spline", "interpolation", "timeseries", "gpu", "simd"]
categories = ["mathematics", "science", "algorithms"]


[features]
default = []
gpu-eager-init = ["dep:ctor"]

[dependencies]
ctor = { workspace = true, optional = true }
anyhow = { workspace = true }
chrono = { workspace = true }
bigdecimal = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
wide = { workspace = true }
rayon = { workspace = true }
tokio = { workspace = true }
sysinfo = { workspace = true }
tempfile = { workspace = true }
fake = { workspace = true, features = ["derive", "bigdecimal", "chrono"] }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
criterion = { workspace = true, features = ["async_futures"] }
rand = { workspace = true }
rand_chacha = { workspace = true }
bigdecimal = { workspace = true, features = ["serde"] }
chrono = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
ratatui = { workspace = true, features = ["default", "all-widgets", "document-features", "macros", "palette", "scrolling-regions", "serde", "termion", "termwiz"] }
crossterm = { workspace = true, features = ["event-stream", "filedescriptor", "libc", "osc52", "serde"]}

[[bench]]
name = "interpolation"
harness = false

[[bench]]
name = "gpu_prewarm"
harness = false

[[bench]]
name = "gpu_cold"
harness = false

[[bench]]
name = "should_use_gpu_analysis"
harness = false

[[bench]]
name = "gpu_optimization_bench"
harness = false
