[package]
name = "splimes"
license.workspace = true
repository.workspace = true
authors.workspace = true
version = "0.1.0"
edition = "2024"

[features]
default = []
gpu-eager-init = ["dep:ctor"]

[dependencies]
ctor = { workspace = true, optional = true }
anyhow = { workspace = true }
chrono = { workspace = true }
bigdecimal = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
flume = { workspace = true }
wide = { workspace = true }
num_cpus = { workspace = true }
rayon = { workspace = true }
tokio = { workspace = true }
futures-channel = { workspace = true }
pollster = { workspace = true }
sysinfo = { workspace = true }
tempfile = { workspace = true }
futures = { workspace = true }
fake = { workspace = true, features = ["derive", "bigdecimal", "chrono"] }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
criterion = { workspace = true, features = ["async_futures"] }
rand = { workspace = true }
rand_chacha = { workspace = true }
bigdecimal = { workspace = true, features = ["serde"] }
chrono = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
ratatui = { workspace = true, features = ["default", "all-widgets", "document-features", "macros", "palette", "scrolling-regions", "serde", "termion", "termwiz"] }
crossterm = { workspace = true, features = ["event-stream", "filedescriptor", "libc", "osc52", "serde"]}

[[bench]]
name = "interpolation"
harness = false

[[bench]]
name = "gpu_prewarm"
harness = false

[[bench]]
name = "gpu_cold"
harness = false

[[bench]]
name = "should_use_gpu_analysis"
harness = false

[[bench]]
name = "gpu_optimization_bench"
harness = false
