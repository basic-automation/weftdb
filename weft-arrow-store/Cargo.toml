[package]
name = "weft-arrow-store"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Read a stored WeftDB aspect range straight into an Apache Arrow RecordBatch."
keywords = ["arrow", "timeseries", "columnar", "weftdb", "parquet"]
categories = ["database", "encoding"]


[lib]
name = "weft_arrow_store"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
arrow-array = { workspace = true }
bigdecimal = { workspace = true }
weftdb = { workspace = true }  # Reference the local workspace member directly
weft-arrow = { workspace = true }
weft-physical-type = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
