[package]
name = "dataset_management"
version = "0.1.0"
edition = "2021"

[dependencies]
bigdecimal = { workspace = true, features = ["serde", "serde-json", "string-only"] }
database = { path = "../database" }  # Reference the local workspace member directly
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
splimes = { path = "../splimes"}
rayon = { workspace = true }
serde = { workspace = true, features = ["derive"] }
rand = { workspace = true }
num_cpus = "1.16"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }

