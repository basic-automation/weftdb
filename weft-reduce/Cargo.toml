[package]
name = "weft-reduce"
license.workspace = true
repository.workspace = true
authors.workspace = true
version = "0.1.0"
edition = "2021"
description = "weft-reduce: vendor-neutral time-series downsampling reductions (min/max/avg/sum/first/last over an epoch-aligned bucket grid, in BigDecimal)."

[dependencies]
# `string-only` makes BigDecimal serialize as a string under serde, so a non-self-describing
# format (bincode — the persisted-partial sidecar codec) can round-trip it; the default impl
# deserializes via `deserialize_any`, which bincode cannot support.
bigdecimal = { workspace = true, features = ["serde", "string-only"] }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
splimes = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
bincode = { workspace = true }
