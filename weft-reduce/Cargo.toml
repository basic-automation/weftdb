[package]
name = "weft-reduce"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Time-series downsampling reductions (min/max/avg/sum/first/last and time-weighted averages) over an epoch-aligned bucket grid, in BigDecimal."
keywords = ["timeseries", "downsampling", "aggregation", "rollup", "bucket"]
categories = ["mathematics", "algorithms", "science"]


[dependencies]
# `string-only` makes BigDecimal serialize as a string under serde, so a non-self-describing
# format (bincode — the persisted-partial sidecar codec) can round-trip it; the default impl
# deserializes via `deserialize_any`, which bincode cannot support.
bigdecimal = { workspace = true, features = ["serde", "string-only"] }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
splimes = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
bincode = { workspace = true }
