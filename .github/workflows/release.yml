name: Release

# Builds weft-server, weft-tui and weft-bench for five targets and attaches them, with a
# SHA256SUMS file, to a draft GitHub release. See RELEASING.md.
#
# - Pushing a tag vX.Y.Z or vX.Y.Z-rc.N releases that tag.
# - Dispatching (Actions tab, or `gh workflow run release.yml`) is a dry run unless
#   dry_run is false: it verifies and builds `ref`, uploads the archives and SHA256SUMS
#   as workflow artifacts, and creates no release. With dry_run=false it releases the
#   existing `tag`, and must be dispatched from that tag (--ref <tag>).
#
# Every job needs `verify` (scripts/release/verify.sh), and everything after it builds
# and releases exactly the commit verify resolved. A release also runs this file and
# scripts/release/ from that commit: verify refuses one dispatched from anywhere but its
# tag, and every job that runs the scripts checks it has that commit's copy. User input
# reaches scripts only through env, never through ${{ }} inside a script.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and upload workflow artifacts, create no release"
        type: boolean
        default: true
      tag:
        description: "Release only (dry_run off): the existing tag to release, e.g. v0.1.0"
        type: string
        default: ""
      ref:
        description: "Dry run only: the branch, tag or commit to build (default: the branch this runs from)"
        type: string
        default: ""
      fast:
        description: "Dry run only: build with the dev profile, to iterate on staging (not a release build)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # verify.sh reads ci.yml's runs for the commit
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      version: ${{ steps.verify.outputs.version }}
      tag: ${{ steps.verify.outputs.tag }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
      label: ${{ steps.label.outputs.label }}
      release: ${{ steps.mode.outputs.release }}
      profile: ${{ steps.mode.outputs.profile }}
    steps:
      # Every branch and tag, which verify.sh checks the tag and the commit's ancestry
      # against. The scripts run are those of the commit this workflow runs from.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Choose the mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          FAST: ${{ inputs.fast }}
        run: |
          set -euo pipefail
          # A tag push releases. A dispatch releases only when dry_run is explicitly false.
          if [[ $EVENT == push || ($EVENT == workflow_dispatch && $DRY_RUN == false) ]]; then
            mode=tag release=true profile=release
          else
            mode=ref release=false profile=release
            [[ $FAST == true ]] && profile=dev
          fi
          {
            echo "mode=$mode"
            echo "release=$release"
            echo "profile=$profile"
          } >>"$GITHUB_OUTPUT"

      - name: Verify
        id: verify
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          PUSHED_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REF: ${{ inputs.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          NOTES_OUT: ${{ runner.temp }}/NOTES.md
        run: |
          set -euo pipefail
          if [[ $MODE == tag ]]; then
            tag=${PUSHED_TAG:-$INPUT_TAG}
            # A release runs this workflow, verify.sh and stage.sh from the tagged commit,
            # never from whatever branch it was dispatched on. A tag push meets this.
            # ($tag is not printed: verify.sh has not checked it yet.)
            if [[ $GITHUB_REF != "refs/tags/$tag" ]]; then
              echo "::error::a release must run from its own tag: dispatch it with --ref <tag>, not from $GITHUB_REF"
              exit 1
            fi
            scripts/release/verify.sh tag "$tag"
          else
            scripts/release/verify.sh ref "${INPUT_REF:-${INPUT_TAG:-$DISPATCH_SHA}}"
          fi

      - name: Assert a release runs from the verified commit
        if: steps.mode.outputs.release == 'true'
        env:
          SHA: ${{ steps.verify.outputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [[ $head != "$SHA" ]]; then
            echo "::error::this workflow and its scripts come from $head, but verify resolved $SHA"
            exit 1
          fi

      # The archives' name. A dry run's names say so, and which commit they were built
      # from, so its artifacts cannot pass for a release's.
      - name: Name the archives
        id: label
        env:
          RELEASE: ${{ steps.mode.outputs.release }}
          PROFILE: ${{ steps.mode.outputs.profile }}
          SHA: ${{ steps.verify.outputs.sha }}
          TAG: ${{ steps.verify.outputs.tag }}
        run: |
          set -euo pipefail
          label=$TAG
          if [[ $RELEASE != true ]]; then
            label="$TAG-dryrun-${SHA:0:12}"
            [[ $PROFILE == dev ]] && label+=-dev
          fi
          echo "label=$label" >>"$GITHUB_OUTPUT"

      - name: Upload the release notes
        if: steps.mode.outputs.mode == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/NOTES.md
          if-no-files-found: error

      - name: Summary
        env:
          SHA: ${{ steps.verify.outputs.sha }}
          TAG: ${{ steps.verify.outputs.tag }}
          LABEL: ${{ steps.label.outputs.label }}
          RELEASE: ${{ steps.mode.outputs.release }}
          PROFILE: ${{ steps.mode.outputs.profile }}
        run: |
          {
            if [[ $RELEASE == true ]]; then
              echo "### Release $TAG"
            else
              echo "### Dry run: no release is created"
            fi
            echo
            echo "- commit: \`$SHA\`"
            echo "- archives: \`weftdb-$LABEL-<target>\`"
            echo "- cargo profile: \`$PROFILE\`"
          } >>"$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    # The x86_64-apple-darwin leg is the slow one: its first dry run spent 90 minutes
    # compiling (fat LTO, one codegen unit, three uncached invocations).
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # Every runner builds its own native target, so no cross toolchain is needed.
      # The images are pinned, not *-latest: the Linux image sets the glibc the binaries
      # need (README.md states it), and a floating label would move it silently.
      # Keep this list in step with TARGETS in the checksums job, and with RELEASING.md.
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          path: src
          persist-credentials: false

      # The commit this workflow runs from. For a release that is the verified commit
      # (asserted below); a dry run may try new scripts on an older commit.
      - name: Check out the release scripts
        uses: actions/checkout@v7
        with:
          path: tools
          persist-credentials: false
          sparse-checkout: scripts/release

      - name: Assert the checkouts are the verified commit
        env:
          SHA: ${{ needs.verify.outputs.sha }}
          RELEASE: ${{ needs.verify.outputs.release }}
        run: |
          set -euo pipefail
          head=$(git -C src rev-parse HEAD)
          if [[ $head != "$SHA" ]]; then
            echo "::error::checked out $head, but verify resolved $SHA"
            exit 1
          fi
          tools=$(git -C tools rev-parse HEAD)
          if [[ $RELEASE == true && $tools != "$SHA" ]]; then
            echo "::error::a release must stage with the verified commit's scripts, not $tools's"
            exit 1
          fi
          echo "building $SHA with the scripts of $tools"

      # The release compiler is the one CI's stable jobs test, pinned in one file.
      - name: Read the release toolchain
        id: toolchain
        run: |
          toolchain=$(tr -d '[:space:]' <src/.github/release-toolchain)
          if [[ ! $toolchain =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.github/release-toolchain must hold a version like 1.99.0"
            exit 1
          fi
          echo "version=$toolchain" >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          targets: ${{ matrix.target }}

      # No build cache, and one cargo invocation per binary: building the three packages
      # in one invocation would unify their features, so a binary could differ from what
      # `cargo build -p <package>` alone produces.
      - name: Build
        working-directory: src
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ needs.verify.outputs.profile }}
        run: |
          set -euo pipefail
          for package in weft-server weft-tui weft-bench; do
            echo "::group::cargo build -p $package"
            cargo build --locked --profile "$PROFILE" --target "$TARGET" -p "$package"
            echo "::endgroup::"
          done
          # Cargo writes the dev profile to target/<triple>/debug.
          profile_dir=$PROFILE
          if [[ $PROFILE == dev ]]; then profile_dir=debug; fi
          echo "BIN_DIR=src/target/$TARGET/$profile_dir" >>"$GITHUB_ENV"

      # Each runner builds its own target, so the binary can run here. weft-bench is the
      # one whose --help exits without starting anything.
      - name: Smoke-test a binary
        run: |
          set -euo pipefail
          exe=''
          if [[ $RUNNER_OS == Windows ]]; then exe=.exe; fi
          "$BIN_DIR/weft-bench$exe" --help >/dev/null

      - name: Stage the archive
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ needs.verify.outputs.label }}
        run: |
          set -euo pipefail
          tools/scripts/release/stage.sh archive "$TARGET" "$LABEL" "$BIN_DIR" src dist

      - uses: actions/upload-artifact@v7
        with:
          name: weftdb-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release scripts
        uses: actions/checkout@v7
        with:
          path: tools
          persist-credentials: false
          sparse-checkout: scripts/release

      - name: Assert a release uses the verified commit's scripts
        if: needs.verify.outputs.release == 'true'
        env:
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          tools=$(git -C tools rev-parse HEAD)
          if [[ $tools != "$SHA" ]]; then
            echo "::error::a release must check its archives with the verified commit's scripts, not $tools's"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: weftdb-*
          path: dist
          merge-multiple: true

      - name: Check each archive and write SHA256SUMS
        env:
          LABEL: ${{ needs.verify.outputs.label }}
          TARGETS: >-
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-pc-windows-msvc
        run: |
          set -euo pipefail
          read -ra targets <<<"$TARGETS"
          tools/scripts/release/stage.sh sums dist "$LABEL" "${targets[@]}"
          (cd dist && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: draft GitHub release
    needs: [verify, checksums]
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    # The only job that can write; every job before it is read-only.
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.verify.outputs.tag }}
      cancel-in-progress: false
    steps:
      # No credentials kept: a third-party action runs in this job, and the repository is
      # public, so re-reading the tag below needs none.
      - name: Check out the verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      # Re-read the tag from origin: if it was moved or deleted after verify ran, stop
      # rather than release something verify did not check.
      - name: Assert the checkout and the tag are the verified commit
        env:
          SHA: ${{ needs.verify.outputs.sha }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [[ $head != "$SHA" ]]; then
            echo "::error::checked out $head, but verify resolved $SHA"
            exit 1
          fi
          git fetch --quiet --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          tagged=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [[ $tagged != "$SHA" ]]; then
            echo "::error::$TAG now points at $tagged, not the verified $SHA"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: weftdb-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes

      # Only the tag's own archives, their .sha256 files and SHA256SUMS may be attached.
      - name: Check the files to attach
        working-directory: dist
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          LABEL: ${{ needs.verify.outputs.label }}
        run: |
          set -euo pipefail
          if [[ $LABEL != "$TAG" ]]; then
            echo "::error::the archives are labelled $LABEL, not $TAG"
            exit 1
          fi
          sha256sum -c SHA256SUMS
          ls -la
          for f in *; do
            case $f in
            *-dryrun-*)
              echo "::error::$f is a dry run's archive"
              exit 1
              ;;
            SHA256SUMS | "weftdb-$TAG"-*.tar.gz | "weftdb-$TAG"-*.tar.gz.sha256 | \
              "weftdb-$TAG"-*.zip | "weftdb-$TAG"-*.zip.sha256) ;;
            *)
              echo "::error::$f is not one of $TAG's release files"
              exit 1
              ;;
            esac
          done

      # softprops updates an existing draft in place and replaces only the assets of the
      # same name, so a stale asset in an earlier draft would ship beside these. Refuse
      # that, and refuse to touch a release that is already published.
      - name: Check the releases already made for the tag
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Drafts included: this token can see them.
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -s --arg tag "$TAG" '[add // [] | .[] | select(.tag_name == $tag)]')
          published=$(jq -r '[.[] | select(.draft | not) | .html_url] | join(" ")' <<<"$releases")
          if [[ -n $published ]]; then
            echo "::error::$TAG is already published ($published); this workflow only drafts"
            exit 1
          fi
          count=$(jq length <<<"$releases")
          if ((count > 1)); then
            echo "::error::$count draft releases exist for $TAG; delete all but one"
            exit 1
          fi
          stale=()
          while IFS= read -r name; do
            [[ -z $name || -f dist/$name ]] || stale+=("$name")
          done < <(jq -r '.[].assets[].name' <<<"$releases")
          if ((${#stale[@]} > 0)); then
            echo "::error::the draft for $TAG has assets this run would not replace: ${stale[*]}; delete them, or the draft"
            exit 1
          fi

      # The publisher checks this against the tag before pressing Publish (RELEASING.md).
      - name: Name the commit in the release notes
        env:
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          printf '\n---\n\n%s\n' \
            "The archives attached to this release were built from commit \`$SHA\`." >>notes/NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ${{ needs.verify.outputs.tag }}
          # The tag exists (verify checked, and so did the step above). Pinning the
          # commit anyway means the release can never be made at the default branch.
          target_commitish: ${{ needs.verify.outputs.sha }}
          body_path: notes/NOTES.md
          # Left as a draft on purpose: a human reviews the notes and the attached
          # archives, then presses publish.
          draft: true
          prerelease: ${{ needs.verify.outputs.prerelease }}
          # A release candidate never becomes Latest.
          make_latest: ${{ needs.verify.outputs.prerelease == 'true' && 'false' || '' }}
          files: dist/*
          fail_on_unmatched_files: true
