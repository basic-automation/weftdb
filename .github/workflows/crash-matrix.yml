name: crash-matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  crash-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build weft-bench
        run: cargo build -p weft-bench --locked
      - name: Run crash matrix
        run: scripts/crash-matrix.sh --stage matrix-artifacts
      - name: Upload matrix report
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: matrix-artifacts
          retention-days: 90
