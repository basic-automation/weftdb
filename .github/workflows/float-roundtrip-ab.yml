# Float roundtrip A/B — serde_json `float_roundtrip` request-level comparison.
#
# Only runs when manually dispatched: a full-workspace A/B build does not fit the
# hosted runner budget (two compilations invalidate the dependency cache, leading to
# a full workspace build twice). The maintainer runs this on demand.
#
# Builds and runs json_body_cost twice — once as shipped (with float_roundtrip), once
# with the feature stripped in the job only. The sed is never committed.

name: float roundtrip A/B

on:
  workflow_dispatch:
    inputs:
      values:
        description: Number of float values in the request body (default 100000)
        required: false
        default: "100000"
      reps:
        description: Timed repetitions after one untimed warm-up (default 20)
        required: false
        default: "20"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Keep concurrent jobs modest so the hosted runner is not starved for CPU/memory.
  # Two builds (with and without float_roundtrip) each compile the whole workspace,
  # and the runner must fit both inside the timeout.
  CARGO_BUILD_JOBS: 2

jobs:
  float-roundtrip-a-b:
    name: float_roundtrip A/B
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the release toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .github/release-toolchain)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      # Build and run with bounded measurement parameters: the point is the
      # A/B delta, not a precise benchmark regression figure. The same bounds
      # apply to both runs so the comparison is fair.
      - name: Run with float_roundtrip (shipped configuration)
        id: on
        shell: bash
        run: |
          set -euo pipefail
          cargo bench -p weft-server --bench json_body_cost -- \
            --warm-up-time 1 --measurement-time 3 --sample-size 20 \
            2>&1 | tee bench-on.txt
          echo "on=$(grep 'ns/value=' bench-on.txt)" >> "$GITHUB_OUTPUT"

      - name: Strip float_roundtrip (in-job only — never committed)
        shell: bash
        run: |
          sed -i 's/features = \["float_roundtrip"\]/features = []/' Cargo.toml
          # Verify it is gone (grep returns 1 when not found, which is success here)
          if grep -q 'float_roundtrip' Cargo.toml; then
            echo "::error::sed did not strip float_roundtrip"
            exit 1
          fi
          echo "float_roundtrip stripped in-job"

      - name: Run without float_roundtrip (recompiles automatically)
        id: off
        shell: bash
        run: |
          set -euo pipefail
          cargo bench -p weft-server --bench json_body_cost -- \
            --warm-up-time 1 --measurement-time 3 --sample-size 20 \
            2>&1 | tee bench-off.txt
          echo "off=$(grep 'ns/value=' bench-off.txt)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo.toml (undo in-job strip)
        shell: bash
        run: git checkout Cargo.toml

      - name: Assert Cargo.toml was never committed stripped
        shell: bash
        run: |
          if ! git diff --exit-code -- Cargo.toml; then
            echo "::error::Cargo.toml has unstaged changes after restore"
            git diff Cargo.toml
            exit 1
          fi
          if ! git diff --cached --exit-code -- Cargo.toml; then
            echo "::error::Cargo.toml has staged changes after restore"
            git diff --cached Cargo.toml
            exit 1
          fi
          echo "Cargo.toml matches HEAD — the strip was in-job only"

      - name: Print summary
        shell: bash
        run: |
          {
            echo "## Float roundtrip A/B"
            echo ""
            echo "### With float_roundtrip"
            echo '```'
            cat bench-on.txt
            echo '```'
            echo "### Without float_roundtrip"
            echo '```'
            cat bench-off.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
