name: cross-engine smoke

# The nightly smoke run of the cross-engine benchmark (EVI-14). It builds weft-xbench — its own
# workspace, because DuckDB compiles from C++ — runs every arm at the `tiny` scale (ClickHouse,
# TimescaleDB, QuestDB, InfluxDB 3 and IoTDB against service containers), and fails
# when any arm disagrees with WeftDB's in-memory reference or the build no longer links.
#
# A smoke test, not a measurement: hosted runners are not reference hardware (decision 19), and a
# `tiny` dataset finishes in milliseconds. The rendered report is uploaded so a failure can be
# read, but its timings are not cited. Like bench-regression.yml, it is a separate workflow so a
# red night cannot veto a release (scripts/release/verify.sh reads only ci.yml), and it runs on no
# push or pull request.

on:
  schedule:
    # 06:30 UTC daily, after bench-regression.yml, so the two do not share a runner wait.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  smoke:
    name: weft-xbench tiny
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The ClickHouse, TimescaleDB, QuestDB, InfluxDB 3 and IoTDB arms need servers. Each is pinned to the version its arm was
    # written against; a newer one is a deliberate bump here, not a silent drift.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.10.3.7@sha256:739e099abd1157390960a59e4532d21781d8fde57e6e4151cb920ea02c30b1ce
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s --health-retries 30
      timescale:
        image: timescale/timescaledb:2.31.0-pg17@sha256:b56a3f51991df1f79d0c1a0841cad5c5fa8058fdd6a3ee6886394a6d4c174538
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: xbench
          POSTGRES_DB: xbench
          # No telemetry from a CI runner.
          TIMESCALEDB_TELEMETRY: "off"
        options: >-
          --health-cmd "pg_isready -U postgres -d xbench"
          --health-interval 5s --health-retries 30
      questdb:
        image: questdb/questdb:10.1.0@sha256:3b11dc5f77aa299c7c9191b10cf50124c9e97663ce93bc50df5040374e87efc9
        ports:
          - 9000:9000
        env:
          # No telemetry from a CI runner; every commit synced, as on the reference host.
          QDB_TELEMETRY_ENABLED: "false"
          QDB_CAIRO_COMMIT_MODE: sync
      influxdb3:
        image: influxdb:3.12.2-core@sha256:26875ba5ae6e843fdbd208b1ac4a55fa1d2ec3aa7faf2d0d1b5035cb1f998990
        ports:
          - 8181:8181
        # A service container takes no command, so `influxdb3 serve` is configured by environment.
        env:
          INFLUXDB3_NODE_ID: xbench
          INFLUXDB3_OBJECT_STORE: file
          INFLUXDB3_DATA_DIR: /var/lib/influxdb3
          INFLUXDB3_START_WITHOUT_AUTH: "true"
          INFLUXDB3_DISABLE_TELEMETRY_UPLOAD: "true"
          # As on the reference host: Core's 432-file query cap is below a multi-year series.
          INFLUXDB3_QUERY_FILE_LIMIT: "300000"
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:8181/health"
          --health-interval 5s --health-retries 30
      iotdb:
        image: apache/iotdb:2.0.11-standalone@sha256:5ace0f3eceff892dd349d02288224c966f3fdeb11d08c4f575b642a110b82338
        ports:
          - 18080:18080
        # The image writes these into iotdb-system.properties before it starts. As on the reference
        # host: the REST service on, nanosecond timestamps (fixed at first start), every WAL entry
        # synced, and a row cap above the largest grid.
        env:
          enable_rest_service: "true"
          timestamp_precision: ns
          wal_mode: SYNC
          rest_query_default_row_size_limit: "10000000"
        options: >-
          --health-cmd "curl -sf -u root:root http://127.0.0.1:18080/ping"
          --health-interval 5s --health-retries 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the release toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .github/release-toolchain)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: weft-xbench

      - name: Check the seeded lock
        run: python3 scripts/xbench/check-lock.py

      # `--locked`: the lock is the seeded one the check above just verified.
      - name: Build
        run: cargo build --locked --release --manifest-path weft-xbench/Cargo.toml

      # The live ClickHouse, TimescaleDB, QuestDB, InfluxDB 3 and IoTDB tests (edges, duplicate instants, buckets) are skipped
      # without a server, so they run here, not in ci.yml.
      - name: Test against the database servers
        env:
          WEFT_XBENCH_CLICKHOUSE: http://127.0.0.1:8123
          WEFT_XBENCH_TIMESCALE: postgresql://postgres:xbench@127.0.0.1:5432/xbench
          WEFT_XBENCH_QUESTDB: 127.0.0.1:9000
          WEFT_XBENCH_INFLUXDB3: http://127.0.0.1:8181
          WEFT_XBENCH_IOTDB: http://127.0.0.1:18080
        run: cargo test --locked --release --manifest-path weft-xbench/Cargo.toml

      - name: Run every arm at the tiny scale
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xbench-scratch"
          TMPDIR="$RUNNER_TEMP/xbench-scratch" weft-xbench/target/release/weft-xbench \
            --scales tiny --reps 3 --load-reps 2 --clickhouse http://127.0.0.1:8123 \
            --timescale postgresql://postgres:xbench@127.0.0.1:5432/xbench \
            --questdb 127.0.0.1:9000 --influxdb3 http://127.0.0.1:8181 \
            --iotdb http://127.0.0.1:18080 --out xbench-out

      - name: Summarise
        if: always()
        shell: bash
        run: |
          if [ -f xbench-out/report.md ]; then cat xbench-out/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xbench-smoke
          path: xbench-out
          if-no-files-found: warn
          retention-days: 30
