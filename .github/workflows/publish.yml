name: Publish to crates.io

# Manual only, on purpose. Publishing is irreversible — a version can be yanked but
# never replaced — so this never fires automatically from a push or a tag.
#
# One dispatch runs one of two jobs:
# - dry-run (the default) verifies every crate and uploads nothing. It names no
#   environment, on purpose: GitHub creates a missing environment, unprotected, the
#   first time a job references it, so a dry run must never mention `crates-io`.
# - execute publishes the existing release `tag`. It runs in the `crates-io`
#   environment, which holds the CARGO_REGISTRY_TOKEN secret (add required reviewers
#   there for a second pair of eyes). It checks out the tag, not the branch the
#   workflow was dispatched from, and proves it did.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify only, upload nothing"
        type: boolean
        default: true
      tag:
        description: "Execute only (dry_run off): the existing release tag to publish, e.g. v0.1.0"
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  dry-run:
    if: inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dry run
        run: ./scripts/publish.sh

  execute:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Validate the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$'
          if [[ ! $TAG =~ $re ]]; then
            echo "::error::tag must be an existing vX.Y.Z or vX.Y.Z-rc.N tag"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Assert the checkout is the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          described=$(git describe --tags --exact-match HEAD)
          if [[ $described != "$TAG" ]]; then
            echo "::error::checked out $described, not $TAG"
            exit 1
          fi
          echo "publishing $TAG at $(git rev-parse HEAD)"

      # No build cache here: the publish verification builds from a clean target dir.
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: ./scripts/publish.sh --execute
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
