name: CI

on:
  push:
    # Release branches too: the release workflow accepts only a push (or dispatched, or
    # scheduled) run of this workflow as evidence that a commit passed CI, never a pull
    # request's run, which tests a merge with the base branch rather than the commit.
    branches: [main, "release/**"]
  pull_request:
  schedule:
    # Nightly: the full suite including the slow pipeline tests, plus a fresh advisory scan.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # rustfmt.toml uses nightly-only options (imports_granularity, group_imports),
  # so the style gate is the one job that needs nightly. The crates build on stable.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Stable jobs build with the release compiler, pinned in one file that the release
      # workflow reads too, so CI tests with the same compiler that builds a release. (Not
      # the same build: CI unifies features across --workspace and uses the dev profile;
      # a release builds each binary alone, with fat LTO.)
      - name: Read the release toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .github/release-toolchain)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Gated on the categories that catch defects. `style`/`pedantic`/`nursery`
      # have a large pre-existing backlog in this workspace; they are reported by
      # running clippy locally, not enforced here, so the gate stays honest.
      #
      # RUSTFLAGS is cleared for this job on purpose: the workflow-level `-D warnings`
      # reaches clippy-driver as a rustc flag and would deny *every* clippy lint,
      # silently turning the category gate below into "deny everything". rustc warnings
      # are still denied by the build/test and msrv jobs.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D clippy::correctness -D clippy::suspicious -D clippy::perf
        env:
          RUSTFLAGS: ""

  # Every performance figure in the README is vouched for by an entry in
  # bench/claims.json, which names the bench or the local corpus behind it and says
  # plainly whether a clone can re-run it. A figure added without an entry, an entry
  # whose figure text no longer sits by its marker, or a source path that moved fails
  # here, so the registry cannot rot into a list of stale claims.
  claims:
    name: claims registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/check_claims.py --registry bench/claims.json --readme README.md

  # The MSRV is a published promise in Cargo.toml (rust-version); prove it still holds.
  # Pinned here on purpose, not read from .github/release-toolchain: this job tests the
  # oldest supported compiler, not the release one.
  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  # Early warning only: upstream crates break on nightly (e.g. turso_core's `branches` 0.4
  # calls a since-removed intrinsic), so this never blocks a merge.
  nightly:
    name: check (nightly, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked
        env:
          RUSTFLAGS: ""

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # Linux runners have no GPU. Mesa's lavapipe is a software Vulkan driver, so splimes'
      # wgpu path runs for real under WeftDB's tests. (splimes' own CI requires a GPU
      # adapter; see github.com/basic-automation/splimes.)
      - name: Install software Vulkan (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          vulkaninfo --summary || true
      - name: Read the release toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .github/release-toolchain)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      # Pull requests and pushes set SKIP_SLOW_TESTS to keep hosted runners inside a sane
      # wall-clock budget; the nightly schedule runs the full suite. The tests check only
      # whether the variable is *set*, so it must be left unset (not empty) there.
      # --test-threads is capped because several suites stand up their own segment
      # stores — at full parallelism a hosted runner gets OOM-killed, which surfaces as
      # a SIGKILL rather than a test failure.
      - name: Test
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then export SKIP_SLOW_TESTS=1; fi
          cargo test --workspace --locked -- --test-threads=4
      # The crash tests arm fault points, which only a `fault-injection` build has. The
      # workspace test above must leave the feature off (weftdb's durable_fault_disabled
      # checks that a production build keeps the points inert), so they run here, per
      # crate. Linux only: the abort tests check the child's SIGABRT.
      - name: Crash tests (fault-injection)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then export SKIP_SLOW_TESTS=1; fi
          cargo test -p weftdb --features fault-injection --locked --test db_tests -- database_new_crash --test-threads=4
          cargo test -p weft-orchestration --features fault-injection --locked --test legacy_queue_crash -- --test-threads=4
          # Not a crash test, but it poisons a store through the same feature's hook.
          cargo test -p weft-server --features fault-injection --locked --test ready_poisoned -- --test-threads=4
      # Tests create their legacy databases in a temporary data dir (weftdb/tests/common,
      # weft-orchestration's test_support, db_tests' own temp dirs), never in the default
      # ~/.weftdb/data. A fresh runner has no ~/.weftdb, so one here was written by a test.
      - name: Tests wrote nothing to ~/.weftdb
        shell: bash
        run: |
          if [ -e "$HOME/.weftdb" ]; then
            echo "::error::the test run wrote to $HOME/.weftdb; a test must create its databases in a temporary data dir"
            find "$HOME/.weftdb" -maxdepth 3 | head -n 50
            exit 1
          fi

  # The workspace jobs never see weft-physical-type's cargo features on their own terms:
  # resolver 2 unifies features across `--workspace`, so weft-bench's `experimental-codecs`
  # is always on there, and nothing turns `bitsliced-codec` on. Selecting packages with `-p`
  # avoids that, so this job checks the configuration crates.io users get (no features) and
  # runs the tests that only compile with `bitsliced-codec` (the reader that stores which set
  # WEFT_SEGMENT_TRANSPOSED_MAX_OVERHEAD depend on). Linux only: the feature split is not
  # platform-specific, and the per-OS test job above already covers the rest.
  features:
    name: feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Read the release toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .github/release-toolchain)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Check default features alone (no workspace feature unification)
        run: cargo check -p weft-physical-type -p weftdb --all-targets --locked
      - name: Build docs for default features alone (deny broken intra-doc links)
        run: cargo doc -p weft-physical-type --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # Same SKIP_SLOW_TESTS / --test-threads policy as the test job.
      - name: Test default features alone, then every optional codec
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then export SKIP_SLOW_TESTS=1; fi
          cargo test -p weft-physical-type --locked -- --test-threads=4
          cargo test -p weft-physical-type --all-features --locked -- --test-threads=4
          cargo test -p weftdb --features bitsliced-codec --lib --test bitsliced_codec_feature --locked -- --test-threads=4

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the release toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .github/release-toolchain)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Build docs (deny broken intra-doc links)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Every published crate must package cleanly before a tag is ever cut.
  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the release toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .github/release-toolchain)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --workspace --no-verify --locked

  # The job above proves each crate builds from its own tarball. This one proves the
  # metadata that decides *what gets published at all* is true: `publish = false` on the
  # three binaries, an explicit version per crate, exactly one edition across the
  # workspace, a versioned requirement on every internal path dependency, and a README
  # and both license texts inside each published crate directory. `scripts/publish.sh`
  # runs the same check before it uploads anything, so the mistake becomes a red check
  # rather than a release that has to be yanked.
  crates:
    name: crate metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/crates -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - run: python3 scripts/crates/check.py check

  # Advisories (vulnerable / unmaintained / unsound / yanked), license allow-list,
  # banned wildcards, and crates.io-only sources. Policy lives in deny.toml.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # THIRD-PARTY-LICENSES.md is the dependency license bundle every release archive carries
  # (1.0 plan PAC-1b, absorbing EVI-20), and it is a committed artifact, so the only honest
  # gate is to regenerate it and compare. cargo-about reads the license texts out of the
  # crate sources it resolves from Cargo.lock, so a dependency whose license it cannot
  # identify fails the generation step (--fail) instead of shipping a bundle with that crate
  # quietly missing from it.
  third-party-licenses:
    name: third-party licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the release toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .github/release-toolchain)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # cargo metadata (which cargo-about runs itself) needs every crate source in the
      # graph for the five shipped targets, so fetch them before generating.
      - name: Fetch the dependency graph
        run: cargo fetch --locked
      # Version pinned, and scripts/licenses/generate.sh refuses any other: the bundle is
      # committed, so an unpinned generator turns every tool upgrade into an unexplained
      # 600 KB diff. RUSTFLAGS carries -D warnings for the Rust jobs, which a third-party
      # crate's own build does not answer to.
      - name: Install cargo-about
        env:
          RUSTFLAGS: ""
        run: cargo install --locked --version 0.9.2 cargo-about --features cli
      - name: THIRD-PARTY-LICENSES.md matches Cargo.lock
        run: scripts/licenses/generate.sh check

  # The contribution-terms workflow runs scripts/contrib/dco_check.py against the GitHub API;
  # this runs the checker's tests against stubbed API responses (scripts/contrib/testdata).
  contrib:
    name: contribution-terms checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts/contrib -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  # The workflows (actionlint, which also shellchecks their run: blocks) and the release
  # scripts (shellcheck, then their tests against a throwaway repository).
  release-scripts:
    name: actionlint + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      # The release pipeline scripts, the fixture generator X-FX added, and the license
      # bundle generator: none of them has any other gate on it, and all three run at
      # release time against a real tag rather than a mocked one.
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck scripts/release/*.sh scripts/compat/*.sh scripts/licenses/*.sh
      - name: verify.sh tests
        run: scripts/release/test-verify.sh
      - name: stage.sh tests
        run: scripts/release/test-stage.sh

  # compat/releases.toml is the pin every compatibility, upgrade and rollback gate runs
  # against: the tag, the commit it points at, the fixture set that release wrote and the
  # digest of every archive it published. This job re-checks the pin against git and
  # against compat/fixtures/, and runs the checker's own tests. The GitHub-side digest
  # check (`releases.py verify-assets`) runs in the release workflow, which has the token.
  compat:
    name: release pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the pins name tags; verify resolves each one locally
      - run: python3 -m unittest discover -s scripts/compat -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - run: python3 scripts/compat/releases.py verify
