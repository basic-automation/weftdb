# yamllint disable rule:line-length
# This file is written at the width the repository aims at, which is wider than yamllint's
# 80-column default: `.yamllint` records that width (100) and why the rule is a warning, and
# 101 lines here were over 80 before any YAML width rule existed. New lines still wrap; the
# rule is off for this file so that a lint run reports findings about our YAML rather than
# findings about its history.
name: CI

on:
  push:
    # Release branches too: the release workflow accepts only a push (or dispatched, or
    # scheduled) run of this workflow as evidence that a commit passed CI, never a pull
    # request's run, which tests a merge with the base branch rather than the commit.
    branches: [main, "release/**"]
  pull_request:
  schedule:
    # Nightly: the full suite including the slow pipeline tests, plus a fresh advisory scan.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # rustfmt.toml uses nightly-only options (imports_granularity, group_imports),
  # so the style gate is the one job that needs nightly. The crates build on stable.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly, 2026-11-07
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Stable jobs build with the release compiler, pinned in one file that the release
      # workflow reads too, so CI tests with the same compiler that builds a release. (Not
      # the same build: CI unifies features across --workspace and uses the dev profile;
      # a release builds each binary alone, with fat LTO.)
      - name: Read the release toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .github/release-toolchain)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      # Gated, on the command line, on the categories that catch defects: correctness,
      # suspicious, perf. `style`/`pedantic`/`nursery` have a large pre-existing backlog
      # in this workspace, so this job does not raise them.
      #
      # That is not the whole gate, and reading only the flags below is how people get
      # surprised. Most crates in this workspace set their own levels at the crate root
      # — `#![deny(clippy::pedantic, clippy::nursery, clippy::all)]` in
      # `weft-bench/src/lib.rs`, `#![forbid(...)]` of the same three in `weft-arrow`,
      # `weft-client`, `weft-line-protocol`, `weft-arrow-store` and the `weft-bench`
      # binaries and integration tests — and a crate-level `deny`/`forbid` is not
      # overridden by the `-D` list. So a new module in `weft-bench` or `weftdb` fails on
      # a `pedantic` lint that a new module in `weft-reduce` only warns about, and the
      # gate is not uniform across the workspace. #635 tracks making it uniform.
      #
      # RUSTFLAGS is cleared for this job on purpose: the workflow-level `-D warnings`
      # reaches clippy-driver as a rustc flag and would deny *every* clippy lint,
      # silently turning the category gate below into "deny everything". rustc warnings
      # are still denied by the build/test and msrv jobs.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D clippy::correctness -D clippy::suspicious -D clippy::perf
        env:
          RUSTFLAGS: ""
      # The gate above is honest about *categories* but silent about *coverage*. A warm
      # rust-cache hit leaves a crate's fingerprint fresh, cargo never re-runs
      # clippy-driver for it, and the job passes having linted a subset of the workspace:
      # `main` sat red because the merge commit that broke it passed a run that restored
      # a cache and printed `Checked 7 crates`, with `weft-bench` never linted at all, and
      # the same tree then failed clippy on a cold runner (#635). This step makes every
      # workspace crate dirty and lints the lot, so the lints the cached gate cannot see
      # are at least named. Report-only on purpose: the first runs are expected to list
      # real defects, and a gate that goes red for pre-existing ones stops being a signal.
      # When this step reports zero errors and full coverage, delete `continue-on-error`
      # and promote it to the gate, which is the actual fix for #635.
      - name: Cold re-lint (report only, #635)
        continue-on-error: true
        shell: bash
        env:
          RUSTFLAGS: ""
        run: |
          set -uo pipefail
          expected=$(cargo metadata --no-deps --format-version 1 | jq '[.packages[] | select(.source == null)] | length')
          git ls-files -z '*.rs' | xargs -0 --no-run-if-empty touch
          cargo clippy --workspace --all-targets --all-features --locked > /tmp/relint.log 2>&1
          status=$?
          checked=$(grep -c '^ *Checking ' /tmp/relint.log || true)
          errors=$(grep -c '^error' /tmp/relint.log || true)
          echo "cold re-lint: $checked of $expected workspace crates compiled, clippy exit $status, $errors error lines"
          if [ "$checked" -lt "$expected" ]; then
            echo "::warning::cold re-lint compiled $checked of $expected workspace crates; something is still skipping the lint pass"
          fi
          if [ "$errors" -gt 0 ]; then
            echo "::warning::cold re-lint found $errors error lines that the cached gate above did not see"
            grep '^error' /tmp/relint.log | head -n 40
          fi

  # Every performance figure in the README is vouched for by an entry in
  # bench/claims.json, which names the bench or the local corpus behind it and says
  # plainly whether a clone can re-run it. A figure added without an entry, an entry
  # whose figure text no longer sits by its marker, or a source path that moved fails
  # here, so the registry cannot rot into a list of stale claims.
  claims:
    name: claims registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 tools/check_claims.py --registry bench/claims.json --readme docs/reference.md --root .
      # Every workflow action must be pinned to a commit SHA (#626).
      - run: python3 scripts/ci/check-action-pinning.py
      # The configuration schema must be complete and versioned (PAC-5a).
      - run: python3 scripts/config/check_schema.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      # Every #[serial] must sit immediately above #[test] or #[tokio::test] (#405).
      - run: python3 scripts/ci/check-serial-order.py
      # The artifact-reference checks in check_claims.py are part of the gate, so
      # their tests run here too (EVI-4).
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      # Unit tests for the serial-order guard.
      - run: python3 -m unittest discover -s scripts/ci -p 'test_check_serial_order.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      # Unit tests for the config-schema checker.
      - run: python3 -m unittest discover -s scripts/config -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  # weft-xbench is its own workspace (it builds DuckDB from C++), so nothing else builds it on
  # every push. Its lock is seeded from the workspace's; this fails when a shared dependency
  # resolves differently in the two, which would benchmark a WeftDB the workspace does not ship.
  xbench-lock:
    name: weft-xbench lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/xbench/check-lock.py
      - run: python3 -m unittest discover -s scripts/xbench -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  # The MSRV is a published promise in Cargo.toml (rust-version); prove it still holds.
  # Pinned here on purpose, not read from .github/release-toolchain: this job tests the
  # oldest supported compiler, not the release one.
  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo check --workspace --all-targets --locked

  # Early warning only: upstream crates break on nightly (e.g. turso_core's `branches` 0.4
  # calls a since-removed intrinsic), so this never blocks a merge.
  nightly:
    name: check (nightly, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly, 2026-11-07
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo check --workspace --all-targets --all-features --locked
        env:
          RUSTFLAGS: ""

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Linux runners have no GPU. Mesa's lavapipe is a software Vulkan driver, so splimes'
      # wgpu path runs for real under WeftDB's tests. (splimes' own CI requires a GPU
      # adapter; see github.com/basic-automation/splimes.)
      # The debug build of the whole workspace (Arrow Flight and tonic among it) no
      # longer fits the hosted Linux runner's free disk; drop preinstalled SDKs we never use.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
      - name: Install software Vulkan (lavapipe)
        if: runner.os == 'Linux'
        # The hosted runners have had hours-long DNS failures for *.ubuntu.com
        # (2026-11-11), so a failed install retries against the kernel.org mirror.
        run: |
          install() {
            sudo apt-get update -o Acquire::Retries=3 &&
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 mesa-vulkan-drivers libvulkan1 vulkan-tools
          }
          if ! install; then
            echo "::warning::Ubuntu archive unreachable; retrying through mirrors.edge.kernel.org"
            sudo find /etc/apt -name '*.list' -o -name '*.sources' | xargs sudo sed -i -E 's#https?://([a-z0-9.-]*\.)?(archive|security)\.ubuntu\.com/ubuntu#http://mirrors.edge.kernel.org/ubuntu#g'
            install
          fi
          vulkaninfo --summary || true
      - name: Read the release toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .github/release-toolchain)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      # Pull requests and pushes set SKIP_SLOW_TESTS to keep hosted runners inside a sane
      # wall-clock budget; the nightly schedule runs the full suite. The tests check only
      # whether the variable is *set*, so it must be left unset (not empty) there.
      # --test-threads is capped because several suites stand up their own segment
      # stores — at full parallelism a hosted runner gets OOM-killed, which surfaces as
      # a SIGKILL rather than a test failure.
      - name: Test
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then export SKIP_SLOW_TESTS=1; fi
          cargo test --workspace --locked -- --test-threads=4
      # The crash tests arm fault points, which only a `fault-injection` build has. The
      # workspace test above must leave the feature off (weftdb's durable_fault_disabled
      # checks that a production build keeps the points inert), so they run here, per
      # crate. Linux only: the abort tests check the child's SIGABRT.
      - name: Crash tests (fault-injection)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then export SKIP_SLOW_TESTS=1; fi
          cargo test -p weftdb --features fault-injection --locked --test db_tests -- database_new_crash --test-threads=4
          cargo test -p weft-orchestration --features fault-injection --locked --test legacy_queue_crash -- --test-threads=4
          # Not a crash test, but it poisons a store through the same feature's hook.
          cargo test -p weft-server --features fault-injection --locked --test ready_poisoned -- --test-threads=4
      # The Python SDK's unit tests, then its contract tests against the weft-server the
      # Build step produced, so a route change that breaks the client fails here. Linux
      # only: the client is pure Python, and the server's platforms are covered above.
      - name: Python SDK (clients/python)
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s clients/python/tests -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          WEFT_SERVER_BIN: target/debug/weft-server
      # The Rust SDK's contract tests against the same server. The workspace run above
      # skips them (no WEFT_SERVER_BIN); `arrow` adds the columnar decode checks.
      - name: Rust SDK contract (weftdb-client)
        if: runner.os == 'Linux'
        run: cargo test -p weftdb-client --features arrow --locked --test live -- --test-threads=4
        env:
          # Absolute: cargo runs an integration test from its package directory.
          WEFT_SERVER_BIN: ${{ github.workspace }}/target/debug/weft-server
      # The R client's offline checks and its contract against the same server, in a pinned
      # rocker/r-ver container (scripts/clients/test-r.sh), so the runner needs no R.
      - name: R client (clients/r)
        if: runner.os == 'Linux'
        run: scripts/clients/test-r.sh target/debug/weft-server
      # Tests create their legacy databases in a temporary data dir (weftdb/tests/common,
      # weft-orchestration's test_support, db_tests' own temp dirs), never in the default
      # ~/.weftdb/data. A fresh runner has no ~/.weftdb, so one here was written by a test.
      - name: Tests wrote nothing to ~/.weftdb
        shell: bash
        run: |
          if [ -e "$HOME/.weftdb" ]; then
            echo "::error::the test run wrote to $HOME/.weftdb; a test must create its databases in a temporary data dir"
            find "$HOME/.weftdb" -maxdepth 3 | head -n 50
            exit 1
          fi

  # The workspace jobs never see weft-physical-type's cargo features on their own terms:
  # resolver 2 unifies features across `--workspace`, so weft-bench's `experimental-codecs`
  # is always on there, and nothing turns `bitsliced-codec` on. Selecting packages with `-p`
  # avoids that, so this job checks the configuration crates.io users get (no features) and
  # runs the tests that only compile with `bitsliced-codec` (the reader that stores which set
  # WEFT_SEGMENT_TRANSPOSED_MAX_OVERHEAD depend on). Linux only: the feature split is not
  # platform-specific, and the per-OS test job above already covers the rest.
  features:
    name: feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read the release toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .github/release-toolchain)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Check default features alone (no workspace feature unification)
        run: cargo check -p weft-physical-type -p weftdb --all-targets --locked
      - name: Build docs for default features alone (deny broken intra-doc links)
        run: cargo doc -p weft-physical-type --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # Same SKIP_SLOW_TESTS / --test-threads policy as the test job.
      - name: Test default features alone, then every optional codec
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then export SKIP_SLOW_TESTS=1; fi
          cargo test -p weft-physical-type --locked -- --test-threads=4
          cargo test -p weft-physical-type --all-features --locked -- --test-threads=4
          cargo test -p weftdb --features bitsliced-codec --lib --test bitsliced_codec_feature --locked -- --test-threads=4
      # The release workflow and the Docker image build `-p weft-server` alone, so its features
      # are not the workspace's: serde_json's `arbitrary_precision` (switched on by another
      # member) once hid a one-ULP JSON float misread that only the per-package build had
      # (2026-11-05). Test the server the way it ships.
      - name: Test weft-server and weftdb as the release builds them (no workspace feature unification)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then export SKIP_SLOW_TESTS=1; fi
          cargo test -p weft-server --lib --locked -- --test-threads=4
          cargo test -p weftdb --lib --locked -- --test-threads=4

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read the release toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .github/release-toolchain)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Build docs (deny broken intra-doc links)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Every published crate must package cleanly before a tag is ever cut.
  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read the release toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .github/release-toolchain)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo package --workspace --no-verify --locked

  # The job above proves each crate builds from its own tarball. This one proves the
  # metadata that decides *what gets published at all* is true: `publish = false` on the
  # three binaries, an explicit version per crate, exactly one edition across the
  # workspace, a versioned requirement on every internal path dependency, and a README
  # and both license texts inside each published crate directory. `scripts/publish.sh`
  # runs the same check before it uploads anything, so the mistake becomes a red check
  # rather than a release that has to be yanked.
  crates:
    name: crate metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/crates -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - run: python3 scripts/crates/check.py check

  # Advisories (vulnerable / unmaintained / unsound / yanked), license allow-list,
  # banned wildcards, and crates.io-only sources. Policy lives in deny.toml.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check advisories bans licenses sources

  # THIRD-PARTY-LICENSES.md is the dependency license bundle every release archive carries
  # (1.0 plan PAC-1b, absorbing EVI-20), and it is a committed artifact, so the only honest
  # gate is to regenerate it and compare. cargo-about reads the license texts out of the
  # crate sources it resolves from Cargo.lock, so a dependency whose license it cannot
  # identify fails the generation step (--fail) instead of shipping a bundle with that crate
  # quietly missing from it.
  third-party-licenses:
    name: third-party licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the release toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .github/release-toolchain)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      # cargo metadata (which cargo-about runs itself) needs every crate source in the
      # graph for the five shipped targets, so fetch them before generating.
      - name: Fetch the dependency graph
        run: cargo fetch --locked
      # Version pinned, and scripts/licenses/generate.sh refuses any other: the bundle is
      # committed, so an unpinned generator turns every tool upgrade into an unexplained
      # 600 KB diff. RUSTFLAGS carries -D warnings for the Rust jobs, which a third-party
      # crate's own build does not answer to.
      - name: Install cargo-about
        env:
          RUSTFLAGS: ""
        run: cargo install --locked --version 0.9.2 cargo-about --features cli
      - name: THIRD-PARTY-LICENSES.md matches Cargo.lock
        run: scripts/licenses/generate.sh check

  # The contribution-terms workflow runs scripts/contrib/dco_check.py against the GitHub API;
  # this runs the checker's tests against stubbed API responses (scripts/contrib/testdata).
  contrib:
    name: contribution-terms checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s scripts/contrib -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  # The workflows (actionlint, which also shellchecks their run: blocks) and the release
  # scripts (shellcheck, then their tests against a throwaway repository).
  release-scripts:
    name: actionlint + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      # A `run:` step that starts with a repository path executes that file, so the file needs
      # the executable bit in the tree - and an editor or an agent that writes the script sets
      # none. The R client step landed that way and made the ubuntu test job red on every open
      # pull request with the least useful error a runner produces: `Permission denied`, exit
      # code 126. This gate names the file and the workflow line instead.
      - name: workflow-invoked scripts are executable
        run: python3 scripts/contrib/check_exec_bits.py
      # The release pipeline scripts, the fixture generator X-FX added, and the license
      # bundle generator: none of them has any other gate on it, and all three run at
      # release time against a real tag rather than a mocked one. The bench artifact
      # pipeline script (EVI-4) joins them: it runs in CI jobs, so a quoting slip
      # in it is a red check here rather than a silently empty artifact. The
      # packaging scripts (PAC-9) join them for the same reason: the image build
      # and its smoke test run in their own workflow, which only the path filter
      # can reach, so this is the gate that sees them on every pull request.
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck scripts/release/*.sh scripts/compat/*.sh \
            scripts/licenses/*.sh scripts/bench/*.sh scripts/packaging/*.sh scripts/clients/*.sh
      - name: verify.sh tests
        run: scripts/release/test-verify.sh
      - name: stage.sh tests
        run: scripts/release/test-stage.sh
      - name: bench stage-artifacts.sh tests
        run: bash scripts/bench/test-stage-artifacts.sh
      - name: bench script tests (ndbc_to_csv.py, check-separation.py)
        run: python3 -m unittest discover -s scripts/bench -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      # Anti-Goodhart (#150): no engine crate depends on a benchmark crate or reads a BENCH variable.
      - name: bench/engine separation
        run: python3 scripts/bench/check-separation.py
      # The glibc floor the release promises is asserted by scripts/check-glibc.sh, which
      # runs only in the release workflow — no CI job otherwise touches it. Its tests stub
      # objdump and readelf so the floor logic is checked here instead, including that the
      # script is executable at all: it landed without the bit, and only a release run
      # would have said so.
      - name: check-glibc.sh tests
        run: scripts/release/test-check-glibc.sh

  # compat/releases.toml is the pin every compatibility, upgrade and rollback gate runs
  # against: the tag, the commit it points at, the fixture set that release wrote and the
  # digest of every archive it published. This job re-checks the pin against git and
  # against compat/fixtures/, and runs the checker's own tests. The GitHub-side digest
  # check (`releases.py verify-assets`) runs in the release workflow, which has the token.
  compat:
    name: release pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the pins name tags; verify resolves each one locally
      - run: python3 -m unittest discover -s scripts/compat -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - run: python3 scripts/compat/releases.py verify
