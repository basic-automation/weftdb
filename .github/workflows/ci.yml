name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly: the full suite including the slow pipeline tests, plus a fresh advisory scan.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # rustfmt.toml uses nightly-only options (imports_granularity, group_imports),
  # so the style gate is the one job that needs nightly. The crates build on stable.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Gated on the categories that catch defects. `style`/`pedantic`/`nursery`
      # have a large pre-existing backlog in this workspace; they are reported by
      # running clippy locally, not enforced here, so the gate stays honest.
      #
      # RUSTFLAGS is cleared for this job on purpose: the workflow-level `-D warnings`
      # reaches clippy-driver as a rustc flag and would deny *every* clippy lint,
      # silently turning the category gate below into "deny everything". rustc warnings
      # are still denied by the build/test and msrv jobs.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D clippy::correctness -D clippy::suspicious -D clippy::perf
        env:
          RUSTFLAGS: ""

  # The MSRV is a published promise in Cargo.toml (rust-version); prove it still holds.
  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  # Early warning only: upstream crates break on nightly (e.g. turso_core's `branches` 0.4
  # calls a since-removed intrinsic), so this never blocks a merge.
  nightly:
    name: check (nightly, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked
        env:
          RUSTFLAGS: ""

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # Linux runners have no GPU. Mesa's lavapipe is a software Vulkan driver, so splimes'
      # wgpu path runs for real under WeftDB's tests. (splimes' own CI requires a GPU
      # adapter; see github.com/basic-automation/splimes.)
      - name: Install software Vulkan (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          vulkaninfo --summary || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      # Pull requests and pushes set SKIP_SLOW_TESTS to keep hosted runners inside a sane
      # wall-clock budget; the nightly schedule runs the full suite. The tests check only
      # whether the variable is *set*, so it must be left unset (not empty) there.
      # --test-threads is capped because several suites stand up their own segment
      # stores — at full parallelism a hosted runner gets OOM-killed, which surfaces as
      # a SIGKILL rather than a test failure.
      - name: Test
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then export SKIP_SLOW_TESTS=1; fi
          cargo test --workspace --locked -- --test-threads=4
      # The crash tests arm fault points, which only a `fault-injection` build has. The
      # workspace test above must leave the feature off (weftdb's durable_fault_disabled
      # checks that a production build keeps the points inert), so they run here, per
      # crate. Linux only: the abort tests check the child's SIGABRT.
      - name: Crash tests (fault-injection)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then export SKIP_SLOW_TESTS=1; fi
          cargo test -p weftdb --features fault-injection --locked --test db_tests -- database_new_crash --test-threads=4
          cargo test -p weft-orchestration --features fault-injection --locked --test legacy_queue_crash -- --test-threads=4

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs (deny broken intra-doc links)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Every published crate must package cleanly before a tag is ever cut.
  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --workspace --no-verify --locked

  # Advisories (vulnerable / unmaintained / unsound / yanked), license allow-list,
  # banned wildcards, and crates.io-only sources. Policy lives in deny.toml.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
