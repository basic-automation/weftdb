[package]
name = "weft-orchestration"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Analytics pipeline for WeftDB: batching, pattern extraction, event detection, correlation and signal generation over stored aspects."
keywords = ["timeseries", "pipeline", "analytics", "anomaly", "weftdb"]
categories = ["science", "algorithms", "database"]


[dependencies]
bigdecimal = { workspace = true, features = ["serde", "serde-json", "string-only"] }
weftdb = { workspace = true }  # Reference the local workspace member directly
anyhow = { workspace = true }
bincode = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
splimes = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
rand = { workspace = true }
num_cpus = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
futures = { workspace = true }
indexmap = { workspace = true, features = ["serde", "rayon"] }
flume = { workspace = true }
wide = { workspace = true }
ahash = { workspace = true }
tracing = { workspace = true }


[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
serial_test = {workspace =  true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

