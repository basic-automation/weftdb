[package]
name = "weft-orchestration"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Analytics pipeline for WeftDB: batching, pattern extraction, event detection, correlation and signal generation over stored aspects."
keywords = ["timeseries", "pipeline", "analytics", "anomaly", "weftdb"]
categories = ["science", "algorithms", "database"]


[dependencies]
sysinfo = { workspace = true }
bigdecimal = { workspace = true, features = ["serde", "serde-json", "string-only"] }
weftdb = { workspace = true }  # Reference the local workspace member directly
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
splimes = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
rand = { workspace = true }
num_cpus = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
futures = { workspace = true }
indexmap = { workspace = true, features = ["serde", "rayon"] }
wide = { workspace = true }
tracing = { workspace = true }


[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
serial_test = {workspace =  true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tempfile = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
# Only to keep the crash tests' deliberately aborted child from dumping core.
libc = { workspace = true }

[features]
# Arms weftdb's crash points (`durable::fault`) for the crash tests below. A feature
# rather than a dev-dependency feature: Cargo unifies features across a workspace build,
# so a dev-dependency enabling it would turn it on for every crate's tests in
# `cargo test --workspace`, and weftdb's check that production builds keep the points
# inert (tests/durable_fault_disabled.rs) would compile to nothing.
fault-injection = ["weftdb/fault-injection"]

# Run with `cargo test -p weft-orchestration --features fault-injection --test legacy_queue_crash`.
[[test]]
name = "legacy_queue_crash"
required-features = ["fault-injection"]
