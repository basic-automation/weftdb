[package]
name = "dsp-bench"
version = "0.1.0"
edition = "2021"
description = "DSP-Bench: reproducible, correctness-gated benchmark harness for DSP (interpolation-heavy irregular time-series)."

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bigdecimal = { workspace = true, features = ["serde"] }
chrono = { workspace = true, features = ["serde"] }
dsp-line-protocol = { workspace = true }
dsp-physical-type = { workspace = true }
dsp-reduce = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
splimes = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util", "macros"] }
