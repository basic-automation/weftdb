[package]
name = "dsp-physical-type"
version = "0.1.0"
edition = "2021"
description = "Vendor-neutral physical numeric encodings for DSP aspects (roadmap Phase 4.1). BigDecimal stays the logical/API value type; each aspect declares a PhysicalType governing how its values are encoded on the hot path. Downcasting is explicit and reports exactness — never a silent BigDecimal -> f64."

[lib]
name = "dsp_physical_type"
path = "src/lib.rs"

[dependencies]
bigdecimal = { workspace = true, features = ["serde"] }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
