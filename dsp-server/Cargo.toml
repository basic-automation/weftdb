[package]
name = "dsp-server"
version = "0.1.0"
edition = "2021"
description = "DSP server: the benchmark-grade HTTP API surface (Phase 2) — health/readiness, and the ingest/query endpoints DSP-Bench drives DSP through."

[lib]
name = "dsp_server"
path = "src/lib.rs"

[[bin]]
name = "dsp-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
bigdecimal = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
dsp-line-protocol = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
splimes = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util", "macros"] }
