[package]
name = "dsp-server"
version = "0.1.0"
edition = "2021"
description = "DSP server: the benchmark-grade HTTP API surface (Phase 2) — health/readiness, and the ingest/query endpoints DSP-Bench drives DSP through."

[lib]
name = "dsp_server"
path = "src/lib.rs"

[[bin]]
name = "dsp-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
bigdecimal = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
database = { path = "../database" }  # control-plane segment store backing the storage query endpoints
dsp-arrow = { workspace = true }  # reconstructed-series -> Arrow IPC / Parquet bytes for the interpolate endpoint (arrow types stay inside dsp-arrow)
dsp-arrow-store = { path = "../dsp-arrow-store" }  # stored range -> Arrow IPC bytes (keeps the arrow-* tree off the lean core)
dsp-line-protocol = { workspace = true }
dsp-physical-type = { workspace = true }  # AspectSchema / PhysicalType / TimeUnit for the catalog-management write path
dsp-reduce = { workspace = true }  # canonical downsample reduction (Aggregation / reduce / bucket_start)
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
splimes = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }  # per-request engine spans on the compute path (Phase 3 instrumentation)
tracing-subscriber = { workspace = true }  # RUST_LOG-driven span/event subscriber (env-filter from the workspace dep)
opentelemetry = { workspace = true }  # OTLP trace export (Phase 3) — env-gated on OTEL_EXPORTER_OTLP_ENDPOINT
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util", "macros"] }
tempfile = { workspace = true }
